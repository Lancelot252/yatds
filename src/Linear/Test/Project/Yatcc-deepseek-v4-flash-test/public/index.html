<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 祖玛游戏 - Zuma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .game-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-display {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .score-item {
            text-align: center;
        }

        .score-item .label {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-item .value {
            font-size: 24px;
            font-weight: 700;
        }

        /* 轨道样式 */
        .track-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .track-label {
            font-size: 14px;
            opacity: 0.6;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .track {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 52px;
            align-items: center;
            padding: 5px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            justify-content: center;
        }

        .track.empty {
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .ball {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.3),
                inset 0 -2px 4px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .ball::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 8px;
            width: 12px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .ball:hover {
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
        }

        .ball.selected {
            transform: translateY(-8px) scale(1.15);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .ball-empty {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .ball-empty:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .ball-empty .pos-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        .position-indicator {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            justify-content: center;
        }

        .pos-btn {
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .pos-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .pos-btn.active {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            border-color: transparent;
        }

        /* 待发射队列 */
        .fire-queue-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .queue-label {
            font-size: 14px;
            opacity: 0.6;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .fire-queue {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .next-ball-highlight {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .next-ball-label {
            font-size: 13px;
            opacity: 0.7;
        }

        .next-ball {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 
                0 6px 12px rgba(0, 0, 0, 0.4),
                inset 0 3px 6px rgba(255, 255, 255, 0.3),
                inset 0 -3px 6px rgba(0, 0, 0, 0.2),
                0 0 30px rgba(255, 255, 255, 0.1);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .btn-fire {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            flex: 1;
            font-size: 16px;
            padding: 12px 24px;
            min-width: 120px;
        }

        .btn-danger {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }

        .btn-success {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .btn-warning {
            background: linear-gradient(90deg, #f39c12, #e67e22);
        }

        .btn-info {
            background: linear-gradient(90deg, #3498db, #2980b9);
        }

        .btn-undo {
            background: linear-gradient(90deg, #1abc9c, #16a085);
        }

        /* 道具区域 */
        .powerups {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .powerup-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .powerup-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .powerup-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .powerup-btn .icon {
            font-size: 18px;
        }

        .powerup-btn .count {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* 消息区域 */
        .messages {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .message {
            padding: 4px 0;
            font-size: 13px;
            opacity: 0.9;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .message:last-child {
            border-bottom: none;
        }

        .message.eliminate {
            color: #f1c40f;
        }

        .message.info {
            color: #85c1e9;
        }

        .message.win {
            color: #2ecc71;
            font-weight: 700;
            font-size: 16px;
        }

        .message.lose {
            color: #e74c3c;
            font-weight: 700;
            font-size: 16px;
        }

        .message.powerup {
            color: #bb8fce;
        }

        /* 游戏结束遮罩 */
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        .game-over-modal h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .game-over-modal .sub {
            font-size: 18px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .game-over-modal .final-score {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 位置选择器 */
        .position-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .position-selector label {
            font-size: 14px;
            opacity: 0.7;
        }

        .position-input {
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            width: 80px;
            font-family: inherit;
            text-align: center;
        }

        .position-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .game-container { padding: 15px; }
            .ball { width: 34px; height: 34px; font-size: 13px; }
            .next-ball { width: 42px; height: 42px; font-size: 16px; }
            .game-title { font-size: 20px; }
            .btn-fire { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-modal">
            <h2 id="resultTitle">🎉 你赢了!</h2>
            <div class="sub" id="resultSub">恭喜通关!</div>
            <div class="final-score" id="finalScore">0</div>
            <button class="btn btn-primary" onclick="newGame()">🔄 再来一局</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 头部 -->
        <div class="game-header">
            <div class="game-title">🌸 祖玛游戏</div>
            <div class="score-display">
                <div class="score-item">
                    <div class="label">得分</div>
                    <div class="value" id="scoreValue" style="color: #f1c40f;">0</div>
                </div>
                <div class="score-item">
                    <div class="label">已发射</div>
                    <div class="value" id="firedValue">0</div>
                </div>
                <div class="score-item">
                    <div class="label">剩余</div>
                    <div class="value" id="remainingValue">30</div>
                </div>
            </div>
        </div>

        <!-- 待发射队列 -->
        <div class="fire-queue-section">
            <div class="queue-label">🎯 待发射队列</div>
            <div class="fire-queue">
                <div class="next-ball-highlight">
                    <span class="next-ball-label">下一个:</span>
                    <div class="next-ball" id="nextBallPreview"></div>
                </div>
                <div id="fireQueueDisplay" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
            </div>
        </div>

        <!-- 位置选择 -->
        <div class="position-selector">
            <label>📍 插入位置:</label>
            <input type="number" class="position-input" id="positionInput" min="0" value="0">
            <span style="font-size:13px;opacity:0.6;">(点击轨道上的球快速定位)</span>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn btn-fire" id="fireBtn" onclick="fireBall()">🎯 发射!</button>
            <button class="btn btn-undo" id="undoBtn" onclick="undoMove()">↩ 撤销</button>
            <button class="btn btn-info" onclick="newGame()">🔄 新游戏</button>
        </div>

        <!-- 道具 -->
        <div class="powerups">
            <button class="powerup-btn" id="bombBtn" onclick="useBomb()">
                <span class="icon">💣</span> 炸弹 <span class="count" id="bombCount">2</span>
            </button>
            <button class="powerup-btn" id="reverseBtn" onclick="useReverse()">
                <span class="icon">🔀</span> 反转 <span class="count" id="reverseCount">1</span>
            </button>
            <button class="powerup-btn" id="shuffleBtn" onclick="useShuffle()">
                <span class="icon">♻️</span> 洗牌 <span class="count" id="shuffleCount">1</span>
            </button>
        </div>

        <!-- 轨道 -->
        <div class="track-section">
            <div class="track-label">🔴 轨道彩球 (点击位置插入)</div>
            <div class="track" id="trackDisplay">
                <span style="opacity:0.3;">加载中...</span>
            </div>
        </div>

        <!-- 消息 -->
        <div class="messages" id="messagesContainer">
            <div class="message info">🎮 欢迎来到祖玛游戏! 点击发射按钮开始游戏。</div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let gameState = null;
        let selectedPosition = 0;

        const COLOR_HEX = {
            'R': '#e74c3c',
            'G': '#2ecc71',
            'B': '#3498db',
            'Y': '#f1c40f',
            'P': '#9b59b6'
        };

        const COLOR_NAMES = {
            'R': 'Red',
            'G': 'Green',
            'B': 'Blue',
            'Y': 'Yellow',
            'P': 'Purple'
        };

        // === API 调用 ===
        async function apiGet(path) {
            try {
                const res = await fetch(`${API_BASE}${path}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                addMessage(`❌ 网络错误: ${e.message}`, 'info');
                return null;
            }
        }

        // === 游戏操作 ===
        async function fireBall() {
            const pos = parseInt(document.getElementById('positionInput').value) || 0;
            setLoading(true);
            const state = await apiGet(`/api/fire?pos=${pos}`);
            setLoading(false);
            if (state) {
                gameState = state;
                render();
            }
        }

        async function useBomb() {
            if (!gameState || gameState.bombCount <= 0) return;
            // 弹出颜色选择
            const colors = ['R', 'G', 'B', 'Y', 'P'];
            const color = await showColorPicker(colors);
            if (!color) return;
            
            setLoading(true);
            const state = await apiGet(`/api/powerup/bomb?color=${color}`);
            setLoading(false);
            if (state) {
                gameState = state;
                render();
            }
        }

        async function useReverse() {
            setLoading(true);
            const state = await apiGet('/api/powerup/reverse');
            setLoading(false);
            if (state) {
                gameState = state;
                render();
            }
        }

        async function useShuffle() {
            setLoading(true);
            const state = await apiGet('/api/powerup/shuffle');
            setLoading(false);
            if (state) {
                gameState = state;
                render();
            }
        }

        async function undoMove() {
            setLoading(true);
            const state = await apiGet('/api/undo');
            setLoading(false);
            if (state) {
                gameState = state;
                render();
            }
        }

        async function newGame() {
            document.getElementById('gameOverOverlay').classList.remove('show');
            setLoading(true);
            const state = await apiGet('/api/newgame');
            setLoading(false);
            if (state) {
                gameState = state;
                document.getElementById('messagesContainer').innerHTML = '';
                addMessage('🔄 新游戏已开始!', 'info');
                render();
            }
        }

        async function fetchState() {
            const state = await apiGet('/api/state');
            if (state) {
                gameState = state;
                render();
            }
        }

        // === 渲染 ===
        function render() {
            if (!gameState) return;

            // 更新分数和统计
            document.getElementById('scoreValue').textContent = gameState.score;
            document.getElementById('firedValue').textContent = gameState.ballsFired;
            document.getElementById('remainingValue').textContent = Math.max(0, gameState.maxFires - gameState.ballsFired);

            // 更新道具计数
            document.getElementById('bombCount').textContent = gameState.bombCount;
            document.getElementById('reverseCount').textContent = gameState.reverseCount;
            document.getElementById('shuffleCount').textContent = gameState.shuffleCount;

            document.getElementById('bombBtn').disabled = gameState.gameOver || gameState.bombCount <= 0;
            document.getElementById('reverseBtn').disabled = gameState.gameOver || gameState.reverseCount <= 0;
            document.getElementById('shuffleBtn').disabled = gameState.gameOver || gameState.shuffleCount <= 0;
            document.getElementById('undoBtn').disabled = !gameState.canUndo || gameState.gameOver;

            // 更新轨道
            renderTrack();
            renderFireQueue();
            renderNextBall();
            updatePositionInput();

            // 检查游戏结束
            if (gameState.gameOver) {
                showGameOver();
            }

            // 更新发射按钮
            document.getElementById('fireBtn').disabled = gameState.gameOver || gameState.fireQueue.length === 0;
        }

        function renderTrack() {
            const container = document.getElementById('trackDisplay');
            if (!gameState.track || gameState.track.length === 0) {
                container.innerHTML = '<span style="opacity:0.3;">✨ 轨道为空 ✨</span>';
                container.classList.add('empty');
                return;
            }
            container.classList.remove('empty');

            container.innerHTML = '';
            gameState.track.forEach((color, index) => {
                const ball = document.createElement('div');
                ball.className = 'ball';
                ball.style.background = `radial-gradient(circle at 35% 35%, ${lighten(COLOR_HEX[color] || '#666')}, ${COLOR_HEX[color] || '#666'})`;
                ball.textContent = color;
                ball.title = `${COLOR_NAMES[color] || color} - 位置 ${index}`;
                ball.onclick = () => {
                    document.getElementById('positionInput').value = index;
                    selectedPosition = index;
                };
                container.appendChild(ball);
            });

            // 添加末尾位置
            const endSlot = document.createElement('div');
            endSlot.className = 'ball-empty';
            endSlot.innerHTML = '<span class="pos-label">→</span>';
            endSlot.title = `插入到末尾 (位置 ${gameState.track.length})`;
            endSlot.onclick = () => {
                document.getElementById('positionInput').value = gameState.track.length;
                selectedPosition = gameState.track.length;
            };
            container.appendChild(endSlot);
        }

        function renderFireQueue() {
            const container = document.getElementById('fireQueueDisplay');
            if (!gameState.fireQueue) return;
            container.innerHTML = '';
            gameState.fireQueue.forEach((color, index) => {
                if (index === 0) return; // 第一个球单独展示
                const ball = document.createElement('div');
                ball.className = 'ball';
                ball.style.width = '32px';
                ball.style.height = '32px';
                ball.style.fontSize = '11px';
                ball.style.background = `radial-gradient(circle at 35% 35%, ${lighten(COLOR_HEX[color] || '#666')}, ${COLOR_HEX[color] || '#666'})`;
                ball.textContent = color;
                container.appendChild(ball);
            });
        }

        function renderNextBall() {
            const container = document.getElementById('nextBallPreview');
            if (!gameState.nextBall || gameState.nextBall === ' ') {
                container.style.background = '#444';
                container.textContent = '?';
                return;
            }
            const color = gameState.nextBall;
            container.style.background = `radial-gradient(circle at 35% 35%, ${lighten(COLOR_HEX[color] || '#666')}, ${COLOR_HEX[color] || '#666'})`;
            container.textContent = color;
        }

        function updatePositionInput() {
            const input = document.getElementById('positionInput');
            const max = gameState.track ? gameState.track.length : 0;
            const val = parseInt(input.value) || 0;
            if (val > max) input.value = max;
            if (val < 0) input.value = 0;
            input.max = max;
        }

        // === 消息系统 ===
        function addMessage(text, className = '') {
            const container = document.getElementById('messagesContainer');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.textContent = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;

            // 限制消息数量
            while (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
        }

        // === 游戏结束 ===
        function showGameOver() {
            const overlay = document.getElementById('gameOverOverlay');
            const title = document.getElementById('resultTitle');
            const sub = document.getElementById('resultSub');
            const score = document.getElementById('finalScore');

            score.textContent = gameState.score;

            if (gameState.won) {
                title.textContent = '🎉 恭喜通关!';
                sub.textContent = '你成功消除了所有彩球!';
            } else {
                title.textContent = '😢 游戏结束';
                sub.textContent = '发射次数已用完!';
            }

            overlay.classList.add('show');
        }

        // === 颜色选择器 ===
        function showColorPicker(colors) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed; top:0; left:0; right:0; bottom:0;
                    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
                    display:flex; justify-content:center; align-items:center;
                    z-index:2000;
                `;

                const modal = document.createElement('div');
                modal.style.cssText = `
                    background: linear-gradient(135deg, #1a1a2e, #16213e);
                    padding: 30px; border-radius: 20px;
                    border: 1px solid rgba(255,255,255,0.1);
                    text-align: center;
                `;

                modal.innerHTML = '<h3 style="margin-bottom:20px;">💣 选择要消除的颜色</h3>';
                
                const colorRow = document.createElement('div');
                colorRow.style.cssText = 'display:flex; gap:12px; justify-content:center; margin-bottom:20px;';

                colors.forEach(c => {
                    const btn = document.createElement('div');
                    btn.className = 'ball';
                    btn.style.cssText += 'cursor:pointer; width:50px; height:50px; font-size:18px;';
                    btn.style.background = `radial-gradient(circle at 35% 35%, ${lighten(COLOR_HEX[c])}, ${COLOR_HEX[c]})`;
                    btn.textContent = c;
                    btn.onclick = () => {
                        document.body.removeChild(overlay);
                        resolve(c);
                    };
                    colorRow.appendChild(btn);
                });

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn btn-danger';
                cancelBtn.textContent = '取消';
                cancelBtn.onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(null);
                };

                modal.appendChild(colorRow);
                modal.appendChild(cancelBtn);
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
            });
        }

        // === 工具函数 ===
        function lighten(hex) {
            if (!hex) return '#888';
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const lr = Math.min(255, r + 80);
            const lg = Math.min(255, g + 80);
            const lb = Math.min(255, b + 80);
            return `#${lr.toString(16).padStart(2, '0')}${lg.toString(16).padStart(2, '0')}${lb.toString(16).padStart(2, '0')}`;
        }

        function setLoading(loading) {
            const btn = document.getElementById('fireBtn');
            if (loading) {
                btn.innerHTML = '<span class="loading"></span> 处理中...';
                btn.disabled = true;
            } else {
                btn.innerHTML = '🎯 发射!';
                btn.disabled = gameState && gameState.gameOver;
            }
        }

        // === 键盘快捷键 ===
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                fireBall();
            }
            if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                undoMove();
            }
        });

        // === 初始化 ===
        fetchState();

        // 每秒自动刷新状态
        setInterval(fetchState, 5000);
    </script>
</body>
</html>
