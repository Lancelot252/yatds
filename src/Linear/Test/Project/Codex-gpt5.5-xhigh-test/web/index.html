<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>链式祖玛</title>
  <style>
    :root {
      --ink: #241f21;
      --paper: #f7f0df;
      --panel: #fff9ea;
      --line: #d7c8a7;
      --teal: #0f766e;
      --red: #d83a34;
      --yellow: #e0a91a;
      --blue: #2e6fbc;
      --green: #3f8f45;
      --purple: #8d4bbb;
      --cyan: #1497a6;
      --shadow: 0 18px 48px rgba(36, 31, 33, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Avenir Next", "Trebuchet MS", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(216, 58, 52, 0.18), transparent 24rem),
        radial-gradient(circle at 85% 8%, rgba(20, 151, 166, 0.18), transparent 22rem),
        linear-gradient(135deg, #f8eed6 0%, #efe1bc 48%, #e7d5a9 100%);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 42px;
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #6b5d44;
      font-size: 15px;
    }

    .score-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(82px, 1fr));
      gap: 8px;
      min-width: 430px;
    }

    .metric {
      border: 1px solid var(--line);
      background: rgba(255, 249, 234, 0.78);
      padding: 10px 12px;
      box-shadow: 0 10px 26px rgba(92, 72, 37, 0.08);
    }

    .metric span {
      display: block;
      color: #7a6a4b;
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1;
    }

    .board {
      border: 1px solid var(--line);
      background: rgba(255, 249, 234, 0.82);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .message {
      min-height: 42px;
      display: flex;
      align-items: center;
      border-left: 5px solid var(--teal);
      background: #fff4cf;
      padding: 10px 14px;
      font-size: 15px;
    }

    .status-pill {
      min-width: 86px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      padding: 9px 14px;
      text-align: center;
      font-weight: 800;
    }

    .track-wrap {
      min-height: 164px;
      overflow-x: auto;
      border: 1px dashed #b9a780;
      background:
        linear-gradient(90deg, rgba(36, 31, 33, 0.04) 1px, transparent 1px) 0 0 / 34px 34px,
        rgba(255, 255, 255, 0.36);
      padding: 28px 20px;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: max-content;
    }

    .slot {
      width: 34px;
      height: 52px;
      flex: 0 0 34px;
      border: 1px solid rgba(36, 31, 33, 0.24);
      background: rgba(255, 255, 255, 0.58);
      color: #8b7d5e;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .slot:hover,
    .slot.selected {
      border-color: var(--teal);
      background: #d9f2ed;
      color: var(--ink);
      transform: translateY(-2px);
    }

    .ball {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border: 3px solid rgba(36, 31, 33, 0.28);
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      box-shadow: inset -10px -12px 0 rgba(0, 0, 0, 0.16), inset 9px 9px 0 rgba(255, 255, 255, 0.24), 0 8px 18px rgba(36, 31, 33, 0.2);
      transition: transform 150ms ease, outline-color 150ms ease;
    }

    .ball:hover,
    .ball.selected {
      outline: 4px solid #f3c74b;
      outline-offset: 4px;
      transform: translateY(-4px);
    }

    .ball[data-color="R"] { background: var(--red); }
    .ball[data-color="Y"] { background: var(--yellow); color: #33260a; text-shadow: none; }
    .ball[data-color="B"] { background: var(--blue); }
    .ball[data-color="G"] { background: var(--green); }
    .ball[data-color="P"] { background: var(--purple); }
    .ball[data-color="C"] { background: var(--cyan); }

    .lower {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .launcher,
    .controls {
      border: 1px solid var(--line);
      background: rgba(255, 249, 234, 0.88);
      padding: 16px;
      box-shadow: 0 12px 30px rgba(92, 72, 37, 0.1);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .current {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    .current .ball {
      width: 72px;
      height: 72px;
      cursor: default;
    }

    .queue {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 46px;
    }

    .queue .ball {
      width: 38px;
      height: 38px;
      flex-basis: 38px;
      border-width: 2px;
      cursor: default;
      font-size: 13px;
      outline: none;
      transform: none;
    }

    .progress {
      width: 100%;
      height: 12px;
      margin-top: 14px;
      border: 1px solid var(--line);
      background: #f1e5c6;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--teal), #d83a34);
      transition: width 200ms ease;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(140px, 1fr));
      gap: 10px;
    }

    .action {
      min-height: 46px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      font-weight: 850;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .action:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(36, 31, 33, 0.18);
    }

    .action.secondary {
      background: #fff9ea;
      color: var(--ink);
    }

    .action.tool {
      background: var(--teal);
      border-color: var(--teal);
    }

    .action.warning {
      background: var(--red);
      border-color: var(--red);
    }

    .action:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .selection {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 10px;
      margin: 0 0 12px;
    }

    .field {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      padding: 10px 12px;
    }

    .field span {
      display: block;
      color: #756846;
      font-size: 12px;
    }

    .field strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
    }

    @media (max-width: 820px) {
      .app {
        width: min(100% - 20px, 760px);
        padding: 16px 0;
      }

      .topbar,
      .lower,
      .status-row {
        grid-template-columns: 1fr;
      }

      .score-strip {
        min-width: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      h1 {
        font-size: 34px;
      }

      .control-grid,
      .selection {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>链式祖玛</h1>
        <p class="subtitle">栈保存撤销历史，队列管理发射彩球，链表承载轨道消除。</p>
      </div>
      <section class="score-strip" aria-label="游戏统计">
        <div class="metric"><span>得分</span><strong id="score">0</strong></div>
        <div class="metric"><span>步数</span><strong id="moves">0</strong></div>
        <div class="metric"><span>轨道</span><strong id="trackSize">0/0</strong></div>
        <div class="metric"><span>队列</span><strong id="launcherSize">0</strong></div>
      </section>
    </header>

    <section class="board">
      <div class="status-row">
        <div class="message" id="message"></div>
        <div class="status-pill" id="status">进行中</div>
      </div>

      <div class="track-wrap" aria-label="彩球轨道">
        <div class="track" id="track"></div>
      </div>

      <div class="lower">
        <aside class="launcher">
          <h2>发射队列</h2>
          <div class="current">
            <div id="currentBall"></div>
            <div>
              <div class="field">
                <span>当前彩球</span>
                <strong id="currentText">-</strong>
              </div>
            </div>
          </div>
          <div class="queue" id="queue"></div>
          <div class="progress" aria-label="轨道容量">
            <span id="capacity"></span>
          </div>
        </aside>

        <section class="controls">
          <h2>操作</h2>
          <div class="selection">
            <div class="field"><span>插入槽位</span><strong id="slotText">0</strong></div>
            <div class="field"><span>道具目标</span><strong id="targetText">0</strong></div>
          </div>
          <div class="control-grid">
            <button class="action" id="fireBtn">发射</button>
            <button class="action secondary" id="undoBtn">撤销</button>
            <button class="action secondary" id="resetBtn">重开</button>
            <button class="action tool" id="rotateBtn">换球</button>
            <button class="action warning" id="bombBtn">爆破 x<span id="bombCount">0</span></button>
            <button class="action tool" id="sweepBtn">同色清除 x<span id="sweepCount">0</span></button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const labels = {
      R: "红",
      Y: "黄",
      B: "蓝",
      G: "绿",
      P: "紫",
      C: "青"
    };

    const nodes = {
      score: document.querySelector("#score"),
      moves: document.querySelector("#moves"),
      trackSize: document.querySelector("#trackSize"),
      launcherSize: document.querySelector("#launcherSize"),
      message: document.querySelector("#message"),
      status: document.querySelector("#status"),
      track: document.querySelector("#track"),
      currentBall: document.querySelector("#currentBall"),
      currentText: document.querySelector("#currentText"),
      queue: document.querySelector("#queue"),
      capacity: document.querySelector("#capacity"),
      slotText: document.querySelector("#slotText"),
      targetText: document.querySelector("#targetText"),
      fireBtn: document.querySelector("#fireBtn"),
      undoBtn: document.querySelector("#undoBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      rotateBtn: document.querySelector("#rotateBtn"),
      bombBtn: document.querySelector("#bombBtn"),
      sweepBtn: document.querySelector("#sweepBtn"),
      bombCount: document.querySelector("#bombCount"),
      sweepCount: document.querySelector("#sweepCount")
    };

    let state = null;
    let selectedSlot = 0;
    let selectedBall = 0;

    function ballElement(color, text, selected = false) {
      const button = document.createElement("button");
      button.className = `ball${selected ? " selected" : ""}`;
      button.type = "button";
      button.dataset.color = color;
      button.textContent = text || color;
      button.title = labels[color] || color;
      return button;
    }

    function slotElement(position) {
      const button = document.createElement("button");
      button.className = `slot${selectedSlot === position ? " selected" : ""}`;
      button.type = "button";
      button.textContent = position;
      button.title = `插入槽位 ${position}`;
      button.addEventListener("click", () => {
        selectedSlot = position;
        render(state);
      });
      return button;
    }

    async function request(path, method = "GET") {
      const response = await fetch(path, { method });
      if (!response.ok) {
        throw new Error(await response.text());
      }
      state = await response.json();
      selectedSlot = Math.min(selectedSlot, state.track.length);
      selectedBall = Math.min(selectedBall, Math.max(0, state.track.length - 1));
      render(state);
    }

    function renderTrack(track) {
      nodes.track.innerHTML = "";
      nodes.track.appendChild(slotElement(0));

      track.forEach((color, index) => {
        const ball = ballElement(color, color, selectedBall === index);
        ball.addEventListener("click", () => {
          selectedBall = index;
          selectedSlot = index + 1;
          render(state);
        });
        nodes.track.appendChild(ball);
        nodes.track.appendChild(slotElement(index + 1));
      });
    }

    function renderQueue(queue) {
      nodes.queue.innerHTML = "";
      queue.forEach((color) => {
        nodes.queue.appendChild(ballElement(color, color));
      });
    }

    function renderCurrent(color) {
      nodes.currentBall.innerHTML = "";
      if (color) {
        nodes.currentBall.appendChild(ballElement(color, color));
        nodes.currentText.textContent = `${labels[color] || color} (${color})`;
      } else {
        nodes.currentText.textContent = "-";
      }
    }

    function render(nextState) {
      if (!nextState) {
        return;
      }

      const statusNames = {
        playing: "进行中",
        won: "胜利",
        lost: "失败"
      };
      const isPlaying = nextState.status === "playing";

      nodes.score.textContent = nextState.score;
      nodes.moves.textContent = nextState.moves;
      nodes.trackSize.textContent = `${nextState.trackSize}/${nextState.maxTrackSize}`;
      nodes.launcherSize.textContent = nextState.launcherSize;
      nodes.message.textContent = nextState.message;
      nodes.status.textContent = statusNames[nextState.status] || nextState.status;
      nodes.slotText.textContent = selectedSlot;
      nodes.targetText.textContent = nextState.track.length ? selectedBall : "-";
      nodes.bombCount.textContent = nextState.powerups.bomb;
      nodes.sweepCount.textContent = nextState.powerups.sweep;
      nodes.capacity.style.width = `${Math.min(100, Math.round(nextState.trackSize / nextState.maxTrackSize * 100))}%`;

      renderTrack(nextState.track);
      renderQueue(nextState.launcher);
      renderCurrent(nextState.currentBall);

      nodes.fireBtn.disabled = !isPlaying || !nextState.currentBall;
      nodes.undoBtn.disabled = !nextState.canUndo;
      nodes.rotateBtn.disabled = !isPlaying || nextState.powerups.rotate <= 0 || nextState.launcherSize < 2;
      nodes.bombBtn.disabled = !isPlaying || nextState.powerups.bomb <= 0 || nextState.track.length === 0;
      nodes.sweepBtn.disabled = !isPlaying || nextState.powerups.sweep <= 0 || nextState.track.length === 0;
    }

    nodes.fireBtn.addEventListener("click", () => request(`/api/insert?pos=${selectedSlot}`, "POST"));
    nodes.undoBtn.addEventListener("click", () => request("/api/undo", "POST"));
    nodes.resetBtn.addEventListener("click", () => {
      selectedSlot = 0;
      selectedBall = 0;
      request("/api/reset", "POST");
    });
    nodes.rotateBtn.addEventListener("click", () => request("/api/rotate", "POST"));
    nodes.bombBtn.addEventListener("click", () => request(`/api/powerup?type=bomb&pos=${selectedBall}`, "POST"));
    nodes.sweepBtn.addEventListener("click", () => request(`/api/powerup?type=sweep&pos=${selectedBall}`, "POST"));

    request("/api/state").catch((error) => {
      nodes.message.textContent = error.message;
    });
  </script>
</body>
</html>
