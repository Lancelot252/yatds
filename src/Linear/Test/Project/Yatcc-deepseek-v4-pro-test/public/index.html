<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 祖玛游戏 - Zuma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 祖玛消除游戏</h1>

        <!-- 游戏初始化面板 -->
        <div id="init-panel" class="panel">
            <h2>游戏设置</h2>
            <div class="settings">
                <label>轨道彩球数: <input type="number" id="init-track" value="10" min="1" max="19"></label>
                <label>队列彩球数: <input type="number" id="init-queue" value="20" min="1" max="50"></label>
                <label>轨道最大容量: <input type="number" id="init-max" value="20" min="3" max="50"></label>
            </div>
            <button class="btn btn-primary" onclick="initGame()">🚀 开始游戏</button>
        </div>

        <!-- 游戏主界面 -->
        <div id="game-panel" class="panel hidden">
            <!-- 待发射队列 -->
            <div class="section">
                <h3>📦 待发射队列 <span id="queue-count" class="badge">0</span></h3>
                <div id="queue-display" class="ball-row"></div>
            </div>

            <!-- 彩球轨道 -->
            <div class="section">
                <h3>🎯 彩球轨道 <span id="track-count" class="badge">0</span> / <span id="track-max">20</span></h3>
                <div class="track-container">
                    <div id="track-display" class="ball-row track-row"></div>
                </div>
                <div class="track-arrows">
                    <span class="arrow">← 队首</span>
                    <span class="arrow">队尾 →</span>
                </div>
                <!-- 插入位置指示器 -->
                <div id="insert-markers" class="insert-markers"></div>
            </div>

            <!-- 操作按钮 -->
            <div class="section">
                <h3>🎮 操作</h3>
                <div class="btn-group">
                    <button class="btn btn-fire" onclick="fireBall()" id="btn-fire">🔫 发射彩球</button>
                    <button class="btn btn-undo" onclick="undoAction()">↩️ 撤销</button>
                </div>
            </div>

            <!-- 小道具 -->
            <div class="section">
                <h3>✨ 小道具</h3>
                <div class="btn-group">
                    <button class="btn btn-item" onclick="useBomb()" title="消除目标位置周围±2的彩球">💣 炸弹</button>
                    <button class="btn btn-item" onclick="useShuffle()" title="随机改变下一个球颜色">🔀 变换颜色</button>
                    <button class="btn btn-item" onclick="usePushBack()" title="移除队尾彩球，队首加入新球">⏪ 轨道回退</button>
                    <button class="btn btn-item" onclick="useRainbow()" title="将指定位置球变为相邻同色">🌈 彩虹球</button>
                </div>
            </div>

            <!-- 状态信息 -->
            <div class="section status-bar">
                <div class="stat">🏆 得分: <span id="score">0</span></div>
                <div class="stat">🔥 连击: <span id="combo">0</span></div>
                <div class="stat">💥 消除: <span id="eliminated">0</span></div>
                <div class="stat" id="game-status">进行中...</div>
            </div>

            <!-- 游戏结束弹窗 -->
            <div id="game-over-modal" class="modal hidden">
                <div class="modal-content">
                    <h2 id="modal-title"></h2>
                    <p id="modal-msg"></p>
                    <button class="btn btn-primary" onclick="resetGame()">🔄 重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
