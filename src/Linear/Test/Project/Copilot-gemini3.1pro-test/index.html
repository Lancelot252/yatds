<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuma Game Demo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #2c3e50; color: white; display:flex; flex-direction:column; align-items:center; }
        .game-board { margin-top: 50px; background: #34495e; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5); width: 80%; max-width: 800px; }
        
        .track { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin: 30px 0; min-height: 50px; padding: 10px; background: #2c3e50; border-radius: 25px;}
        
        .ball { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; color: white; text-shadow: 1px 1px 2px black; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5); }
        .ball.R { background-color: #e74c3c; }
        .ball.G { background-color: #2ecc71; }
        .ball.B { background-color: #3498db; }
        .ball.Y { background-color: #f1c40f; color: black; text-shadow: none; }
        .ball.X { background-color: #000000; color: #e74c3c; font-size: 20px; border: 2px solid red; box-shadow: 0 0 10px red; } /* Bomb Prop */
        
        .insert-slot { width: 20px; height: 40px; border-radius: 10px; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.1); }
        .insert-slot:hover { background: rgba(255,255,255,0.8); width: 30px; }
        
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px;}
        .button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #3498db; color: white; transition: 0.2s; }
        .button:hover { background: #2980b9; }
        .button:disabled { background: #7f8c8d; cursor: not-allowed; }
        
        .pending-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .pending-title { margin-right: 15px; display:flex; align-items:center; }
        .next-ball { transform: scale(1.2); border: 2px solid white; }
    </style>
</head>
<body>
    <h1>Zuma Game Simulation</h1>
    <div class="game-board">
        <div>
            <h2>Score: <span id="score">0</span></h2>
            <h3 id="message" style="color: #f1c40f;"></h3>
        </div>
        
        <div class="pending-container">
            <div class="pending-title">Next balls:</div>
            <div id="pending-balls" style="display:flex; gap: 10px;"></div>
        </div>

        <p>Click on the space between the balls to insert the next ball.</p>
        <p><strong>R/G/B/Y</strong> are regular balls. <strong>X</strong> is a BOMB that destroys surrounding balls.</p>

        <div id="track" class="track"></div>

        <div class="controls">
            <button class="button" id="undoBtn" onclick="undo()" disabled>Undo</button>
            <button class="button" id="resetBtn" onclick="resetGame()">Restart Game</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';

        async function fetchState() {
            const res = await fetch(`${API_URL}/api/state`);
            const data = await res.json();
            render(data);
        }

        async function insertBall(pos) {
            const res = await fetch(`${API_URL}/api/insert`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `pos=${pos}`
            });
            const data = await res.json();
            render(data);
        }

        async function undo() {
            const res = await fetch(`${API_URL}/api/undo`, { method: 'POST' });
            const data = await res.json();
            render(data);
        }

        async function resetGame() {
            const res = await fetch(`${API_URL}/api/reset`, { method: 'POST' });
            const data = await res.json();
            render(data);
        }

        function createBallElem(color, extraClass = '') {
            const b = document.createElement('div');
            b.className = `ball ${color} ${extraClass}`;
            b.innerText = color;
            return b;
        }

        function render(data) {
            document.getElementById('score').innerText = data.score;
            const msgEl = document.getElementById('message');
            if (data.isWon) {
                msgEl.innerText = "You Won! The track is clear!";
            } else if (data.isLost) {
                msgEl.innerText = "Game Over! The track is too long!";
            } else {
                msgEl.innerText = "";
            }

            document.getElementById('undoBtn').disabled = !data.canUndo;

            // Render pending
            const pCont = document.getElementById('pending-balls');
            pCont.innerHTML = '';
            data.pending.forEach((c, index) => {
                pCont.appendChild(createBallElem(c, index === 0 ? 'next-ball' : ''));
            });

            // Render track
            const trackEl = document.getElementById('track');
            trackEl.innerHTML = '';
            
            // Initial slot
            const slot0 = document.createElement('div');
            slot0.className = 'insert-slot';
            slot0.onclick = () => insertBall(0);
            trackEl.appendChild(slot0);

            data.track.forEach((c, index) => {
                trackEl.appendChild(createBallElem(c));
                
                const slot = document.createElement('div');
                slot.className = 'insert-slot';
                slot.onclick = () => insertBall(index + 1);
                trackEl.appendChild(slot);
            });
        }

        // Init
        fetchState();
    </script>
</body>
</html>
