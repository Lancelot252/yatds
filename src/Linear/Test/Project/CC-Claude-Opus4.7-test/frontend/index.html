<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>祖玛 · 链表 / 队列 / 栈 综合应用</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <h1>祖玛 <span class="subtitle">Linear Structures Demo</span></h1>
  <div class="status">
    <span id="status-label" class="badge badge-playing">游戏中</span>
    <span class="score">得分: <strong id="score">0</strong></span>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">轨道（双向链表）</div>
    <div class="track-wrap">
      <div id="track" class="track"></div>
      <div class="track-hint">点击两球之间的空隙插入当前彩球；点击道具后再点击具体位置生效。</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">待发射队列（队列 FIFO）</div>
    <div class="queue-wrap">
      <div class="current-ball-wrap">
        <div class="current-label">当前球</div>
        <div id="current-ball" class="ball ball-current"></div>
      </div>
      <div id="pending" class="pending"></div>
    </div>
  </section>

  <section class="panel controls">
    <div class="panel-title">道具与控制（撤销使用栈 LIFO）</div>
    <div class="control-row">
      <button id="btn-undo" class="ctrl">撤销</button>
      <button id="btn-bomb" class="ctrl ctrl-bomb">炸弹 (<span id="bomb-uses">2</span>)</button>
      <button id="btn-recolor" class="ctrl ctrl-recolor">变色 (<span id="recolor-uses">2</span>)</button>
      <button id="btn-skip" class="ctrl ctrl-skip">跳过当前 (<span id="skip-uses">3</span>)</button>
    </div>
    <div class="control-row">
      <label>颜色数 <input id="cfg-colors" type="number" min="3" max="8" value="5"/></label>
      <label>初始球数 <input id="cfg-init" type="number" min="0" max="25" value="10"/></label>
      <label>队列长度 <input id="cfg-queue" type="number" min="1" max="100" value="20"/></label>
      <label>随机种子 <input id="cfg-seed" type="number" min="0" value="0"/></label>
      <button id="btn-restart" class="ctrl ctrl-restart">开始新游戏</button>
    </div>
    <div id="mode-hint" class="mode-hint">模式：发射</div>
    <div id="message-log" class="message-log"></div>
  </section>
</main>

<div id="recolor-picker" class="picker hidden">
  <div class="picker-title">选择目标颜色</div>
  <div id="recolor-options" class="picker-options"></div>
  <button id="recolor-cancel" class="ctrl">取消</button>
</div>

<script src="/script.js"></script>
</body>
</html>
