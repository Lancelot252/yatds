<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>祖玛链表挑战</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <h1>祖玛链表挑战</h1>
        <p id="message">正在连接后端...</p>
      </div>
      <div class="stats">
        <span>分数 <strong id="score">0</strong></span>
        <span>回合 <strong id="turns">0</strong>/<strong id="maxTurns">45</strong></span>
      </div>
    </section>

    <section class="board">
      <div class="section-title">
        <h2>轨道</h2>
        <span>点击空位插入当前彩球，点击彩球可选为炸弹目标</span>
      </div>
      <div id="track" class="track"></div>
    </section>

    <section class="panel">
      <div>
        <h2>待发射队列</h2>
        <div id="launcher" class="launcher"></div>
      </div>
      <div class="controls">
        <button id="bombBtn" type="button">使用炸弹</button>
        <button id="shuffleBtn" type="button">重排队列</button>
        <button id="undoBtn" type="button">撤销</button>
        <button id="resetBtn" type="button">新游戏</button>
      </div>
    </section>

    <section class="rules">
      <h2>目标</h2>
      <p>清空轨道或达到 120 分即胜利。连续 3 个及以上同色彩球自动消除，消除后会继续检查连锁。炸弹会移除轨道上所有同色彩球，重排会改变待发射队列顺序。</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
