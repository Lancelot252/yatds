<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>祖玛游戏 - Copilot-gpt4.1-test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>祖玛游戏</h1>
    <div id="game">
        <div id="track"></div>
        <div id="queue"></div>
        <div id="controls">
            <input type="number" id="insertPos" min="0" placeholder="插入位置">
            <button id="fireBtn">发射彩球</button>
            <button id="undoBtn">撤销</button>
        </div>
        <div id="message"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
