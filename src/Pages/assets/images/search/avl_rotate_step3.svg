<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AVL右旋步骤3 - 平衡结果">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".10"/></filter>
</defs>
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">AVL 树右旋（LL 型调整）</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">旋转完成：树已恢复平衡，任意节点 |bf| ≤ 1</text>

<!-- 平衡后的树结构:
       3  (bf=0)
      / \
     1   5  (bf=0, bf=0)
-->

<!-- 树的边 -->
<line x1="360" y1="120" x2="260" y2="200" stroke="#2d9bb3" stroke-width="2.2"/>
<line x1="360" y1="120" x2="460" y2="200" stroke="#2d9bb3" stroke-width="2.2"/>

<!-- 节点 3 (新根) -->
<circle cx="360" cy="105" r="34" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
<text x="360" y="113" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#fff">3</text>

<!-- bf=0 标注 -->
<rect x="396" y="88" width="52" height="22" rx="4" fill="#dff5f7" stroke="#187990" stroke-width="1"/>
<text x="422" y="104" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">bf = 0</text>

<!-- 节点 1 -->
<circle cx="260" cy="215" r="30" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
<text x="260" y="223" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">1</text>
<rect x="218" y="238" width="52" height="22" rx="4" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
<text x="244" y="254" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">bf = 0</text>

<!-- 节点 5 -->
<circle cx="460" cy="215" r="30" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
<text x="460" y="223" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">5</text>
<rect x="418" y="238" width="52" height="22" rx="4" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
<text x="444" y="254" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">bf = 0</text>

<!-- 高度注释 -->
<text x="360" y="305" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">树高度：2　各节点平衡因子：0</text>

<!-- 结果说明框 -->
<rect x="180" y="322" width="360" height="46" rx="8" fill="#187990"/>
<text x="360" y="342" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">✓ 旋转完成，AVL 平衡恢复</text>
<text x="360" y="360" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#dff5f7">中序遍历：1 → 3 → 5（仍为有序序列）</text>

<rect x="20" y="335" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="356" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 3</text>

<!-- 对比提示 -->
<rect x="550" y="100" width="148" height="80" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="624" y="122" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">旋转总结</text>
<text x="624" y="140" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">高度 3 → 2</text>
<text x="624" y="158" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">查找复杂度</text>
<text x="624" y="174" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#187990">O(n) → O(log n)</text>
</svg>
