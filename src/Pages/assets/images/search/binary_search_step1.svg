<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="二分查找步骤1">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>

<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">二分查找</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">有序数组，target = 11，通过折半快速定位</text>

<!-- 有序数组 [1, 3, 5, 7, 9, 11, 13] -->
<g transform="translate(95, 85)">
  <text x="-60" y="30" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <g filter="url(#sh)">
    <rect x="0"   y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="36"  y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">1</text>
    <rect x="76"  y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="112" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">3</text>
    <rect x="152" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="188" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">5</text>
    <!-- mid = 3 -->
    <rect x="228" y="-6" width="72" height="62" rx="8" fill="#2d9bb3" stroke="#187990" stroke-width="2.2"/>
    <text x="264" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">7</text>
    <rect x="304" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="340" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">9</text>
    <rect x="380" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="416" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">11</text>
    <rect x="456" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="492" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">13</text>
  </g>
  <text x="36"  y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">0</text>
  <text x="112" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">1</text>
  <text x="188" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">2</text>
  <text x="264" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#2d9bb3">3</text>
  <text x="340" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">4</text>
  <text x="416" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">5</text>
  <text x="492" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">6</text>
</g>

<!-- lo / hi / mid 指针 -->
<text x="131" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">lo=0</text>
<text x="359" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#2d9bb3">mid=3</text>
<text x="623" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">hi=6</text>

<!-- 区间线 -->
<line x1="95" y1="208" x2="643" y2="208" stroke="#d8e8ec" stroke-width="1.5"/>
<line x1="95" y1="204" x2="95" y2="212" stroke="#187990" stroke-width="2"/>
<line x1="643" y1="204" x2="643" y2="212" stroke="#187990" stroke-width="2"/>
<line x1="359" y1="204" x2="359" y2="212" stroke="#2d9bb3" stroke-width="2"/>

<!-- 比较说明 -->
<rect x="200" y="220" width="320" height="62" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="246" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">比较：nums[mid=3] = 7</text>
<text x="360" y="268" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">7 &lt; 11 = target，令 lo = mid + 1 = 4</text>

<rect x="20" y="302" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="323" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 1</text>

<rect x="610" y="290" width="92" height="44" rx="8" fill="#187990"/>
<text x="656" y="308" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#fff">target = 11</text>
<text x="656" y="328" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#dff5f7">O(log n)</text>
</svg>
