<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="斐波那契查找步骤1 - 按Fibonacci分割">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
  <marker id="arrB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2d9bb3"/>
  </marker>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">斐波那契查找（Fibonacci Search）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">有序数组 [1,3,5,7,9,11,13]（n=7），target=11，F(6)=8 ≥ 7</text>

<!-- 斐波那契数列说明 -->
<rect x="30" y="70" width="660" height="30" rx="6" fill="#dff5f7" stroke="#187990" stroke-width="1"/>
<text x="360" y="90" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#187990">斐波那契数列：1, 1, 2, 3, 5, 8, 13 …　　第一次分割位置 = F(5) − 1 = 4</text>

<!-- 数组格子 -->
<g transform="translate(55,120)">
  <!-- 下标 -->
  <text x="45" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">0</text>
  <text x="135" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">1</text>
  <text x="225" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">2</text>
  <text x="315" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">3</text>
  <text x="405" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#f0a500" font-weight="700">4</text>
  <text x="495" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">5</text>
  <text x="585" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">6</text>

  <!-- 左部分（F(5)=5个，索引0-3灰色） -->
  <rect x="0" y="0" width="90" height="52" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="45" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">1</text>
  <rect x="90" y="0" width="90" height="52" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="135" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">3</text>
  <rect x="180" y="0" width="90" height="52" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="225" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">5</text>
  <rect x="270" y="0" width="90" height="52" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="315" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">7</text>
  <!-- probe index 4 -->
  <rect x="360" y="0" width="90" height="52" rx="5" fill="#f0a500" stroke="#c8a800" stroke-width="2.5" filter="url(#sh)"/>
  <text x="405" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">9</text>
  <!-- 右部分 -->
  <rect x="450" y="0" width="90" height="52" rx="5" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.8"/>
  <text x="495" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">11</text>
  <rect x="540" y="0" width="90" height="52" rx="5" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.8"/>
  <text x="585" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">13</text>

  <!-- probe 箭头 -->
  <text x="405" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#f0a500">probe=4</text>

  <!-- 左部分括号标注 F(5)=5 -->
  <line x1="0" y1="64" x2="360" y2="64" stroke="#b8c4cc" stroke-width="1.5"/>
  <text x="180" y="80" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#b8c4cc">左半部分 F(5)=5 个元素</text>

  <!-- 右部分括号标注 F(4)=3 -->
  <line x1="450" y1="64" x2="630" y2="64" stroke="#2d9bb3" stroke-width="1.5"/>
  <text x="540" y="80" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#2d9bb3">右半部分 F(4)=3 个</text>
</g>

<!-- 比较结果 -->
<rect x="110" y="270" width="500" height="80" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="294" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">比较：A[4] = 9 &lt; target = 11</text>
<text x="360" y="316" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">目标在 probe 右侧，收缩到右半部分 [11, 13]（索引 5-6）</text>
<text x="360" y="338" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#2d9bb3">更新：lo = 5，k = k − 2 = 4，下次分割用 F(2) = 1</text>

<rect x="20" y="340" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="359" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 1</text>
</svg>
