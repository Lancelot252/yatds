<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BST删除步骤3 - 删除完成">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">BST 删除操作</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">删除完成：5 已被中序后继 7 替换，BST 性质保持</text>

<!-- 结果树 -->
<g transform="translate(0,70)">
  <line x1="360" y1="50" x2="220" y2="130" stroke="#2d9bb3" stroke-width="2.2"/>
  <line x1="360" y1="50" x2="500" y2="130" stroke="#2d9bb3" stroke-width="2.2"/>
  <line x1="220" y1="155" x2="150" y2="230" stroke="#2d9bb3" stroke-width="1.8"/>
  <!-- 7 没有右子节点（原7已删） -->
  <line x1="500" y1="155" x2="440" y2="230" stroke="#2d9bb3" stroke-width="1.8"/>
  <line x1="500" y1="155" x2="560" y2="230" stroke="#2d9bb3" stroke-width="1.8"/>

  <!-- 根 8 -->
  <circle cx="360" cy="40" r="28" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
  <text x="360" y="48" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">8</text>

  <!-- 节点7（原5位置，深色绿标注新节点） -->
  <circle cx="220" cy="145" r="28" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
  <text x="220" y="153" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">7</text>
  <rect x="168" y="176" width="104" height="22" rx="4" fill="#dff5f7" stroke="#187990" stroke-width="1"/>
  <text x="220" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">替换后的根</text>

  <!-- 节点12 -->
  <circle cx="500" cy="145" r="28" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
  <text x="500" y="153" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">12</text>

  <!-- 节点3（7的左子节点，保持） -->
  <circle cx="150" cy="245" r="24" fill="#dff5f7" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="150" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1d2a2f">3</text>

  <!-- 节点10, 14 -->
  <circle cx="440" cy="245" r="24" fill="#dff5f7" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="440" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1d2a2f">10</text>
  <circle cx="560" cy="245" r="24" fill="#dff5f7" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="560" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1d2a2f">14</text>

  <!-- 结果说明 -->
  <rect x="80" y="290" width="560" height="58" rx="8" fill="#187990" filter="url(#sh)"/>
  <text x="360" y="313" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">✓ 删除成功！中序遍历仍为有序：3→7→8→10→12→14</text>
  <text x="360" y="335" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#dff5f7">BST 结构性质：左子树 &lt; 根 &lt; 右子树，删除后仍满足</text>
</g>

<rect x="20" y="430" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="449" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 3</text>
</svg>
