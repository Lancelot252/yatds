<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="顺序查找步骤4 - 找到目标">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">顺序查找</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">目标 target = 7，从数组头部开始逐一比较</text>

<g transform="translate(105, 90)">
  <text x="-60" y="30" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <g filter="url(#sh)">
    <rect x="0"   y="0" width="72" height="50" rx="8" fill="#b8c4cc" stroke="#8c959f" stroke-width="1.5"/>
    <text x="36"  y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">3</text>
    <rect x="76"  y="0" width="72" height="50" rx="8" fill="#b8c4cc" stroke="#8c959f" stroke-width="1.5"/>
    <text x="112" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">5</text>
    <rect x="152" y="0" width="72" height="50" rx="8" fill="#b8c4cc" stroke="#8c959f" stroke-width="1.5"/>
    <text x="188" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">1</text>
    <!-- index 3: FOUND -->
    <rect x="228" y="0" width="72" height="50" rx="8" fill="#187990" stroke="#0d5e6e" stroke-width="2.2"/>
    <text x="264" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#fff">7</text>
    <rect x="304" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="340" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">2</text>
    <rect x="380" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="416" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">6</text>
  </g>
  <!-- checkmark over found element -->
  <text x="264" y="-10" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#187990">✓</text>
  <text x="36"  y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">0</text>
  <text x="112" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">1</text>
  <text x="188" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">2</text>
  <text x="264" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">3</text>
  <text x="340" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">4</text>
  <text x="416" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">5</text>
</g>

<path d="M 369 185 L 369 158" stroke="#187990" stroke-width="2.5" fill="none"/>
<polygon points="362,162 376,162 369,150" fill="#187990"/>
<text x="369" y="202" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">i = 3</text>

<!-- 找到提示 -->
<rect x="220" y="190" width="280" height="56" rx="8" fill="#187990"/>
<text x="360" y="215" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">查找成功！</text>
<text x="360" y="237" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#dff5f7">nums[3] = 7 = target，返回下标 3</text>

<rect x="20" y="282" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="303" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 4</text>

<rect x="604" y="85" width="92" height="60" rx="8" fill="#187990"/>
<text x="650" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fff">target</text>
<text x="650" y="136" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#fff">7</text>
</svg>
