<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="索引顺序表查找步骤1 - 结构说明">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">索引顺序表查找（分块查找）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">将有序表分块，建立索引，target = 20</text>

<!-- 数据块 -->
<g transform="translate(50,80)">
  <!-- Block 1 -->
  <rect x="0" y="0" width="170" height="120" rx="8" fill="#f7fbfc" stroke="#b8c4cc" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="85" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#61737c">块 1</text>
  <rect x="15" y="32" width="60" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="45" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">3</text>
  <rect x="90" y="32" width="60" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="120" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">8</text>
  <text x="85" y="102" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#b8c4cc">下标 0-1，最大值 8</text>

  <!-- Block 2 -->
  <rect x="200" y="0" width="170" height="120" rx="8" fill="#dff5f7" stroke="#2d9bb3" stroke-width="2" filter="url(#sh)"/>
  <text x="285" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#2d9bb3">块 2</text>
  <rect x="215" y="32" width="60" height="44" rx="5" fill="#f7fbfc" stroke="#2d9bb3" stroke-width="1.5"/>
  <text x="245" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#1d2a2f">15</text>
  <rect x="295" y="32" width="60" height="44" rx="5" fill="#f0a500" stroke="#c8a800" stroke-width="2.5" filter="url(#sh)"/>
  <text x="325" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">20</text>
  <text x="285" y="102" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#2d9bb3">下标 2-3，最大值 20</text>

  <!-- Block 3 -->
  <rect x="400" y="0" width="170" height="120" rx="8" fill="#f7fbfc" stroke="#b8c4cc" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="485" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#61737c">块 3</text>
  <rect x="415" y="32" width="60" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="445" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">28</text>
  <rect x="490" y="32" width="60" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="520" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">35</text>
  <text x="485" y="102" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#b8c4cc">下标 4-5，最大值 35</text>
</g>

<!-- 索引表 -->
<text x="360" y="228" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">↓ 索引表（每块的最大关键字与起始位置）</text>

<g transform="translate(110,244)">
  <!-- 表头 -->
  <rect x="0" y="0" width="120" height="32" rx="0" fill="#187990"/>
  <text x="60" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fff">最大关键字</text>
  <rect x="120" y="0" width="100" height="32" rx="0" fill="#187990"/>
  <text x="170" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fff">起始下标</text>
  <rect x="220" y="0" width="80" height="32" rx="0" fill="#187990"/>
  <text x="260" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fff">块大小</text>

  <!-- 行1 -->
  <rect x="0" y="32" width="120" height="30" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="60" y="52" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">8</text>
  <rect x="120" y="32" width="100" height="30" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="170" y="52" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">0</text>
  <rect x="220" y="32" width="80" height="30" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="260" y="52" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">2</text>

  <!-- 行2 高亮 -->
  <rect x="0" y="62" width="120" height="30" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5"/>
  <text x="60" y="82" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">20</text>
  <rect x="120" y="62" width="100" height="30" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5"/>
  <text x="170" y="82" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">2</text>
  <rect x="220" y="62" width="80" height="30" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5"/>
  <text x="260" y="82" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">2</text>

  <!-- 行3 -->
  <rect x="0" y="92" width="120" height="30" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="60" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">35</text>
  <rect x="120" y="92" width="100" height="30" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="170" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">4</text>
  <rect x="220" y="92" width="80" height="30" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="260" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">2</text>
</g>

<rect x="20" y="344" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="363" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 1</text>
</svg>
