<svg viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="插值查找步骤2 - 命中目标">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">插值查找（Interpolation Search）</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">A[probe] = A[5] = 11 = target，一次探针直接命中</text>

<!-- 数组格子 -->
<g transform="translate(100,90)">
  <text x="37" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">0</text>
  <text x="111" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">1</text>
  <text x="185" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">2</text>
  <text x="259" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">3</text>
  <text x="333" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">4</text>
  <text x="407" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">5</text>
  <text x="481" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">6</text>

  <rect x="0" y="0" width="74" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="37" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">1</text>
  <rect x="74" y="0" width="74" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="111" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">3</text>
  <rect x="148" y="0" width="74" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="185" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">5</text>
  <rect x="222" y="0" width="74" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="259" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">7</text>
  <rect x="296" y="0" width="74" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="333" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">9</text>
  <!-- 命中格子 -->
  <rect x="370" y="0" width="74" height="50" rx="6" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
  <text x="407" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">11</text>
  <rect x="444" y="0" width="74" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="481" y="31" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#b8c4cc">13</text>

  <text x="407" y="66" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">✓ 命中</text>
</g>

<!-- 结果框 -->
<rect x="160" y="200" width="400" height="60" rx="8" fill="#187990" filter="url(#sh)"/>
<text x="360" y="225" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">查找成功！target = 11 在索引 5</text>
<text x="360" y="250" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#dff5f7">仅 1 次探针（数据均匀分布时接近 O(1)）</text>

<!-- 对比说明 -->
<rect x="80" y="278" width="560" height="56" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="300" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">与二分查找对比：</text>
<text x="360" y="320" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">二分固定取中间 → 需 3 次；插值按比例估算 → 仅 1 次</text>

<rect x="20" y="338" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="357" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 2</text>
</svg>
