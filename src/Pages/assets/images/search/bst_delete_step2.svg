<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BST删除步骤2 - 找到中序后继">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
  <marker id="arrO" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#f0a500"/>
  </marker>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">BST 删除操作</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">找中序后继：右子树中最小的节点（一路向左直到底）</text>

<!-- 树结构 -->
<g transform="translate(0,70)">
  <line x1="360" y1="50" x2="220" y2="130" stroke="#d8e8ec" stroke-width="2"/>
  <line x1="360" y1="50" x2="500" y2="130" stroke="#d8e8ec" stroke-width="2"/>
  <line x1="220" y1="155" x2="150" y2="230" stroke="#d8e8ec" stroke-width="2"/>
  <!-- 5->7 边高亮 -->
  <line x1="220" y1="155" x2="290" y2="230" stroke="#f0a500" stroke-width="3"/>
  <line x1="500" y1="155" x2="440" y2="230" stroke="#d8e8ec" stroke-width="2"/>
  <line x1="500" y1="155" x2="560" y2="230" stroke="#d8e8ec" stroke-width="2"/>

  <!-- 根 8 -->
  <circle cx="360" cy="40" r="28" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
  <text x="360" y="48" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">8</text>

  <!-- 节点5（待删除，半透明红色） -->
  <circle cx="220" cy="145" r="28" fill="#e55a5a" stroke="#c02020" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#sh)"/>
  <text x="220" y="153" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">5</text>

  <!-- 节点12 -->
  <circle cx="500" cy="145" r="28" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
  <text x="500" y="153" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">12</text>

  <!-- 节点3 -->
  <circle cx="150" cy="245" r="24" fill="#dff5f7" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="150" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1d2a2f">3</text>

  <!-- 节点7（中序后继，橙色标注） -->
  <circle cx="290" cy="245" r="26" fill="#f0a500" stroke="#c8a800" stroke-width="2.5" filter="url(#sh)"/>
  <text x="290" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">7</text>
  <rect x="238" y="275" width="104" height="22" rx="4" fill="#fff8e6" stroke="#f0a500" stroke-width="1"/>
  <text x="290" y="291" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#c8a800">中序后继 ✓</text>

  <!-- 节点10, 14 -->
  <circle cx="440" cy="245" r="24" fill="#dff5f7" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="440" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1d2a2f">10</text>
  <circle cx="560" cy="245" r="24" fill="#dff5f7" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="560" y="253" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1d2a2f">14</text>

  <!-- 7 无左子树标注 -->
  <text x="290" y="306" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">（7 无左子节点，即为最小）</text>

  <!-- 说明框 -->
  <rect x="110" y="325" width="500" height="62" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
  <text x="360" y="347" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">中序后继 = 5 的右子树（根为 7）中最左的节点</text>
  <text x="360" y="367" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">从 7 开始一路向左找，7 无左子节点 → 7 就是后继</text>
  <text x="360" y="382" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#187990">操作：将 7 的值复制到节点 5，再删除原节点 7</text>
</g>

<rect x="20" y="430" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="449" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 2</text>
</svg>
