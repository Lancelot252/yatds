<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B树步骤2 - 查找路径">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">B-树查找（B-Tree Search）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">查找 target = 15：在根节点定位范围，进入中间子节点命中</text>

<!-- 根节点 [10|20]：已访问，灰色 -->
<rect x="240" y="78" width="240" height="52" rx="8" fill="#b8c4cc" stroke="#8c959f" stroke-width="2" filter="url(#sh)"/>
<line x1="320" y1="82" x2="320" y2="126" stroke="#8c959f" stroke-width="1.5"/>
<line x1="400" y1="82" x2="400" y2="126" stroke="#8c959f" stroke-width="1.5"/>
<text x="280" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">10</text>
<text x="360" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">20</text>
<text x="450" y="104" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">10&lt;15&lt;20</text>
<text x="450" y="120" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#2d9bb3">→ 走中间指针</text>

<!-- 连线：根到三个子节点，中间高亮 -->
<line x1="280" y1="130" x2="150" y2="195" stroke="#d8e8ec" stroke-width="1.5"/>
<line x1="360" y1="130" x2="360" y2="195" stroke="#f0a500" stroke-width="3"/>
<line x1="440" y1="130" x2="570" y2="195" stroke="#d8e8ec" stroke-width="1.5"/>

<!-- 左子节点 [3|7]（未访问，淡色） -->
<rect x="60" y="195" width="180" height="50" rx="6" fill="#f2f4f5" stroke="#e0e8eb" stroke-width="1.5"/>
<line x1="120" y1="199" x2="120" y2="241" stroke="#e0e8eb" stroke-width="1.5"/>
<line x1="180" y1="199" x2="180" y2="241" stroke="#e0e8eb" stroke-width="1.5"/>
<text x="90" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#c8cdd0">3</text>
<text x="150" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#c8cdd0">7</text>

<!-- 中子节点 [12|15]：命中，高亮 -->
<rect x="270" y="195" width="180" height="50" rx="6" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
<line x1="330" y1="199" x2="330" y2="241" stroke="#2d9bb3" stroke-width="1.5"/>
<line x1="390" y1="199" x2="390" y2="241" stroke="#2d9bb3" stroke-width="1.5"/>
<text x="300" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#dff5f7">12</text>
<text x="360" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">15</text>

<!-- 右子节点 [25|30]（未访问，淡色） -->
<rect x="480" y="195" width="180" height="50" rx="6" fill="#f2f4f5" stroke="#e0e8eb" stroke-width="1.5"/>
<line x1="540" y1="199" x2="540" y2="241" stroke="#e0e8eb" stroke-width="1.5"/>
<line x1="600" y1="199" x2="600" y2="241" stroke="#e0e8eb" stroke-width="1.5"/>
<text x="510" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#c8cdd0">25</text>
<text x="570" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#c8cdd0">30</text>

<!-- 标注 -->
<text x="360" y="262" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">✓ 在中间子节点 [12|15] 中找到 15</text>

<!-- 结果框 -->
<rect x="110" y="276" width="500" height="66" rx="8" fill="#187990" filter="url(#sh)"/>
<text x="360" y="300" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">查找成功！target = 15，共访问 2 个节点</text>
<text x="360" y="322" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#dff5f7">时间复杂度 O(log_m n)；树高低，每层对应一次磁盘读取</text>

<rect x="20" y="326" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="345" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 2</text>
</svg>
