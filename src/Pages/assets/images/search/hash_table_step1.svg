<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="哈希表步骤1 - 初始状态">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">哈希表操作</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">哈希函数 h(key) = key % 11，表长 = 11</text>

<!-- 哈希表格 (11个槽位，索引0-10) -->
<g transform="translate(200, 90)">
  <!-- 表头 -->
  <text x="-40" y="30" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">下标</text>
  <text x="200" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">值</text>

  <!-- 槽位 0-10 -->
  <g filter="url(#sh)">
    <rect x="0"   y="40" width="48" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="24"  y="64" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">0</text>
    <rect x="48"  y="40" width="130" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="113" y="64" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#b8c4cc">空</text>

    <rect x="0"   y="76" width="48" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="24"  y="100" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">1</text>
    <rect x="48"  y="76" width="130" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="113" y="100" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#b8c4cc">空</text>

    <rect x="0"   y="112" width="48" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="24"  y="136" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">2</text>
    <rect x="48"  y="112" width="130" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="113" y="136" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#b8c4cc">空</text>

    <rect x="0"   y="148" width="48" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="24"  y="172" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">3</text>
    <rect x="48"  y="148" width="130" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="113" y="172" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#b8c4cc">空</text>

    <rect x="0"   y="184" width="48" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="24"  y="208" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">…</text>
    <rect x="48"  y="184" width="130" height="36" rx="0" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
    <text x="113" y="208" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#b8c4cc">空</text>
  </g>
</g>

<!-- 说明 -->
<rect x="450" y="100" width="230" height="100" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="565" y="124" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">哈希函数设计</text>
<text x="565" y="146" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">除留余数法：</text>
<text x="565" y="164" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">h(key) = key % 11</text>
<text x="565" y="184" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">均匀分布，表长取质数</text>

<rect x="450" y="220" width="230" height="60" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/>
<text x="565" y="246" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">初始状态</text>
<text x="565" y="268" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">哈希表为空，共 11 个槽位</text>

<rect x="20" y="300" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="321" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 1</text>
</svg>
