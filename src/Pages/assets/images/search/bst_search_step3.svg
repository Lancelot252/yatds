<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BST查找步骤3 - 找到目标">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".10"/></filter>
</defs>
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">二叉搜索树查找</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">target = 10，从根节点出发逐层比较</text>

<!-- 边 -->
<line x1="360" y1="110" x2="240" y2="180" stroke="#edf4f6" stroke-width="1.5"/>
<line x1="360" y1="110" x2="480" y2="180" stroke="#b8c4cc" stroke-width="1.8"/>
<line x1="240" y1="210" x2="180" y2="280" stroke="#edf4f6" stroke-width="1.5"/>
<line x1="240" y1="210" x2="300" y2="280" stroke="#edf4f6" stroke-width="1.5"/>
<line x1="480" y1="210" x2="420" y2="280" stroke="#2d9bb3" stroke-width="2.5" stroke-dasharray="6,3"/>
<line x1="480" y1="210" x2="540" y2="280" stroke="#d8e8ec" stroke-width="2"/>

<!-- 节点 8 (已访问) -->
<circle cx="360" cy="95" r="32" fill="#b8c4cc" stroke="#8c959f" stroke-width="1.8" filter="url(#sh)"/>
<text x="360" y="103" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">8</text>

<!-- 节点 5 (不在路径) -->
<circle cx="240" cy="195" r="28" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.5" filter="url(#sh)"/>
<text x="240" y="203" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#aab8be">5</text>

<!-- 节点 12 (已访问) -->
<circle cx="480" cy="195" r="32" fill="#b8c4cc" stroke="#8c959f" stroke-width="1.8" filter="url(#sh)"/>
<text x="480" y="203" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">12</text>

<!-- 节点 3 -->
<circle cx="180" cy="295" r="24" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4" filter="url(#sh)"/>
<text x="180" y="302" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#aab8be">3</text>

<!-- 节点 7 -->
<circle cx="300" cy="295" r="24" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4" filter="url(#sh)"/>
<text x="300" y="302" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#aab8be">7</text>

<!-- 节点 10 (FOUND) -->
<circle cx="420" cy="295" r="30" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
<text x="420" y="303" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="800" fill="#fff">10</text>
<text x="420" y="260" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#187990">✓</text>

<!-- 节点 14 -->
<circle cx="540" cy="295" r="24" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4" filter="url(#sh)"/>
<text x="540" y="302" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#aab8be">14</text>

<!-- 查找路径 8→12→10 -->
<text x="360" y="348" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">查找路径：8 → 12 → 10</text>

<!-- 说明框 -->
<rect x="530" y="220" width="170" height="64" rx="8" fill="#187990"/>
<text x="615" y="244" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">查找成功！</text>
<text x="615" y="265" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#dff5f7">共比较 3 次</text>
<text x="615" y="281" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#dff5f7">返回节点 10</text>

<rect x="20" y="340" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="361" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 3</text>

<rect x="600" y="75" width="100" height="44" rx="8" fill="#187990"/>
<text x="650" y="93" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#fff">target = 10</text>
<text x="650" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#dff5f7">O(log n) 平均</text>
</svg>
