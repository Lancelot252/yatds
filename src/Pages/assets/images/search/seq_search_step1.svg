<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="顺序查找步骤1">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>

<!-- 标题 -->
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">顺序查找</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">目标 target = 7，从数组头部开始逐一比较</text>

<!-- 数组 [3, 5, 1, 7, 2, 6] -->
<g transform="translate(105, 90)">
  <!-- 数组标签 -->
  <text x="-60" y="30" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>

  <!-- 6个元素 -->
  <g filter="url(#sh)">
    <rect x="0"   y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="36"  y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">3</text>
    <rect x="76"  y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="112" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">5</text>
    <rect x="152" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="188" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">1</text>
    <rect x="228" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="264" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">7</text>
    <rect x="304" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="340" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">2</text>
    <rect x="380" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="416" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">6</text>
  </g>

  <!-- 下标 -->
  <text x="36"  y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">0</text>
  <text x="112" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">1</text>
  <text x="188" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">2</text>
  <text x="264" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">3</text>
  <text x="340" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">4</text>
  <text x="416" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">5</text>
</g>

<!-- 指针箭头在 index=0 -->
<path d="M 141 186 L 141 178" stroke="#2d9bb3" stroke-width="2.5" fill="none"/>
<polygon points="134,178 148,178 141,166" fill="#2d9bb3"/>
<text x="127" y="183" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2d9bb3">i = 0</text>

<!-- 比较说明 -->
<rect x="240" y="190" width="240" height="56" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="216" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">比较：nums[0] = 3</text>
<text x="360" y="238" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">3 ≠ 7，继续向右移动</text>

<!-- Step 标签 -->
<rect x="20" y="282" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="303" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 1</text>

<!-- target 标签 -->
<rect x="604" y="85" width="92" height="60" rx="8" fill="#187990"/>
<text x="650" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fff">target</text>
<text x="650" y="136" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#fff">7</text>
</svg>
