<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B树步骤1 - B树结构">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">B-树查找（B-Tree Search）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">阶数 m=3：每个非叶节点含 1-2 个关键字，2-3 个孩子指针</text>

<!-- 根节点 [10|20] -->
<rect x="240" y="78" width="240" height="52" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<line x1="320" y1="82" x2="320" y2="126" stroke="#187990" stroke-width="1.5"/>
<line x1="400" y1="82" x2="400" y2="126" stroke="#187990" stroke-width="1.5"/>
<text x="280" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#187990">10</text>
<text x="360" y="112" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#187990">20</text>
<text x="450" y="108" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">← 根节点</text>

<!-- 连线：根到三个子节点 -->
<line x1="280" y1="130" x2="150" y2="195" stroke="#2d9bb3" stroke-width="2"/>
<line x1="360" y1="130" x2="360" y2="195" stroke="#2d9bb3" stroke-width="2"/>
<line x1="440" y1="130" x2="570" y2="195" stroke="#2d9bb3" stroke-width="2"/>

<!-- 左子节点 [3|7] -->
<rect x="60" y="195" width="180" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.8" filter="url(#sh)"/>
<line x1="120" y1="199" x2="120" y2="241" stroke="#d8e8ec" stroke-width="1.5"/>
<line x1="180" y1="199" x2="180" y2="241" stroke="#d8e8ec" stroke-width="1.5"/>
<text x="90" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">3</text>
<text x="150" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">7</text>

<!-- 中子节点 [12|15] -->
<rect x="270" y="195" width="180" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.8" filter="url(#sh)"/>
<line x1="330" y1="199" x2="330" y2="241" stroke="#d8e8ec" stroke-width="1.5"/>
<line x1="390" y1="199" x2="390" y2="241" stroke="#d8e8ec" stroke-width="1.5"/>
<text x="300" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">12</text>
<text x="360" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">15</text>

<!-- 右子节点 [25|30] -->
<rect x="480" y="195" width="180" height="50" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.8" filter="url(#sh)"/>
<line x1="540" y1="199" x2="540" y2="241" stroke="#d8e8ec" stroke-width="1.5"/>
<line x1="600" y1="199" x2="600" y2="241" stroke="#d8e8ec" stroke-width="1.5"/>
<text x="510" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">25</text>
<text x="570" y="227" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">30</text>

<!-- 说明框 -->
<rect x="60" y="265" width="600" height="72" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="288" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">B-树关键性质（m=3）：</text>
<text x="360" y="308" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">① 每节点最多 m-1=2 个关键字；② 非根节点至少 ⌈m/2⌉-1=1 个关键字</text>
<text x="360" y="328" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">③ 关键字有序；④ 全部叶节点在同一层，树高均衡，降低磁盘 I/O 次数</text>

<rect x="20" y="328" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="347" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 1</text>
</svg>
