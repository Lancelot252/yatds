<svg viewBox="0 0 720 342" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="索引顺序表查找步骤3 - 块内查找命中">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">索引顺序表查找（分块查找）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">第二步：在块 2 内顺序比较，命中 target = 20</text>

<!-- 块2内顺序查找 -->
<g transform="translate(160,90)">
  <text x="200" y="-10" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2d9bb3">块 2（下标 2-3）</text>
  <!-- 元素 15 -->
  <rect x="0" y="0" width="140" height="60" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.8"/>
  <text x="70" y="38" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" fill="#b8c4cc">15</text>
  <text x="70" y="78" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#b8c4cc">比较①: 15≠20</text>

  <!-- 元素 20（命中） -->
  <rect x="160" y="0" width="140" height="60" rx="8" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
  <text x="230" y="38" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">20</text>
  <text x="230" y="78" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">比较②: 20=20 ✓</text>
</g>

<!-- 结果框 -->
<rect x="120" y="188" width="480" height="60" rx="8" fill="#187990" filter="url(#sh)"/>
<text x="360" y="214" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">查找成功！target = 20 在索引 3（块 2）</text>
<text x="360" y="238" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#dff5f7">总比较次数：索引 2 次 + 块内 2 次 = 4 次</text>

<!-- ASL 公式 -->
<rect x="60" y="262" width="600" height="42" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="280" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">平均查找长度：</text>
<text x="360" y="298" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">ASL ≈ log₂(b+1) + s/2，b 为块数，s 为块大小（顺序）；比顺序查找快，比二分慢</text>

<rect x="20" y="308" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="327" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 3</text>
</svg>
