<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="静态树表步骤2 - 查找路径">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">静态树表查找（Static Tree Table）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">在判定树中查找 target = 9，沿路径比较至叶节点</text>

<!-- 判定树（带查找路径高亮） -->
<g transform="translate(0,75)">
  <!-- 所有边，查找路径用高亮色 -->
  <line x1="360" y1="28" x2="220" y2="88" stroke="#d8e8ec" stroke-width="1.8"/>
  <!-- 高亮路径: 7 -> 11 -> 9 -->
  <line x1="360" y1="28" x2="500" y2="88" stroke="#f0a500" stroke-width="3"/>
  <line x1="220" y1="110" x2="150" y2="160" stroke="#d8e8ec" stroke-width="1.8"/>
  <line x1="220" y1="110" x2="290" y2="160" stroke="#d8e8ec" stroke-width="1.8"/>
  <line x1="500" y1="110" x2="430" y2="160" stroke="#f0a500" stroke-width="3"/>
  <line x1="500" y1="110" x2="570" y2="160" stroke="#d8e8ec" stroke-width="1.8"/>

  <!-- 比较过程标注 -->
  <text x="446" y="66" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#f0a500">9&gt;7 → 右</text>
  <text x="394" y="142" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#f0a500">9&lt;11 → 左</text>

  <!-- 根 7（已访问，灰化） -->
  <circle cx="360" cy="18" r="22" fill="#b8c4cc" stroke="#8c959f" stroke-width="2" filter="url(#sh)"/>
  <text x="360" y="25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">7</text>
  <text x="345" y="-4" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">①</text>

  <!-- 3（未访问） -->
  <circle cx="220" cy="100" r="20" fill="#f2f4f5" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="220" y="107" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" fill="#b8c4cc">3</text>
  <!-- 11（已访问，灰化） -->
  <circle cx="500" cy="100" r="20" fill="#b8c4cc" stroke="#8c959f" stroke-width="2" filter="url(#sh)"/>
  <text x="500" y="107" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">11</text>
  <text x="525" y="95" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">②</text>

  <!-- 叶节点 1, 5（未访问） -->
  <circle cx="150" cy="172" r="18" fill="#f2f4f5" stroke="#e0e8eb" stroke-width="1.5"/>
  <text x="150" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" fill="#b8c4cc">1</text>
  <circle cx="290" cy="172" r="18" fill="#f2f4f5" stroke="#e0e8eb" stroke-width="1.5"/>
  <text x="290" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" fill="#b8c4cc">5</text>
  <!-- 叶节点 9（命中） -->
  <circle cx="430" cy="172" r="20" fill="#187990" stroke="#0d5e6e" stroke-width="2.5" filter="url(#sh)"/>
  <text x="430" y="179" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">9</text>
  <text x="394" y="160" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">③</text>
  <!-- 13（未访问） -->
  <circle cx="570" cy="172" r="18" fill="#f2f4f5" stroke="#e0e8eb" stroke-width="1.5"/>
  <text x="570" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" fill="#b8c4cc">13</text>

  <!-- 结果框 -->
  <rect x="110" y="205" width="520" height="58" rx="8" fill="#187990" filter="url(#sh)"/>
  <text x="370" y="228" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">✓ 查找成功：key = 9 在深度 3 处命中</text>
  <text x="370" y="252" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#dff5f7">比较次数：3 次（7 → 11 → 9）= 树高 O(log n)</text>

  <!-- 对比顺序查找 -->
  <rect x="110" y="275" width="520" height="38" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="370" y="299" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">顺序查找需 5 次比较；静态树表 3 次即可定位（提升约 40%）</text>
</g>

<rect x="20" y="330" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="349" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 2</text>
</svg>
