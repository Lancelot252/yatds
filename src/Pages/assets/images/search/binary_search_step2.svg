<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="二分查找步骤2">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">二分查找</text>
<text x="360" y="58" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">有序数组，target = 11，通过折半快速定位</text>

<g transform="translate(95, 85)">
  <text x="-60" y="30" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <g filter="url(#sh)">
    <!-- 0-3 已排除 -->
    <rect x="0"   y="0" width="72" height="50" rx="8" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4"/>
    <text x="36"  y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#aab8be">1</text>
    <rect x="76"  y="0" width="72" height="50" rx="8" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4"/>
    <text x="112" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#aab8be">3</text>
    <rect x="152" y="0" width="72" height="50" rx="8" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4"/>
    <text x="188" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#aab8be">5</text>
    <rect x="228" y="0" width="72" height="50" rx="8" fill="#edf4f6" stroke="#b8c4cc" stroke-width="1.4"/>
    <text x="264" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#aab8be">7</text>
    <!-- 搜索范围 4-6 -->
    <rect x="304" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="340" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">9</text>
    <!-- mid=5 -->
    <rect x="380" y="-6" width="72" height="62" rx="8" fill="#2d9bb3" stroke="#187990" stroke-width="2.2"/>
    <text x="416" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">11</text>
    <rect x="456" y="0" width="72" height="50" rx="8" fill="#dff5f7" stroke="#187990" stroke-width="1.8"/>
    <text x="492" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1d2a2f">13</text>
  </g>
  <text x="36"  y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#aab8be">0</text>
  <text x="112" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#aab8be">1</text>
  <text x="188" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#aab8be">2</text>
  <text x="264" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#aab8be">3</text>
  <text x="340" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">4</text>
  <text x="416" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#2d9bb3">5</text>
  <text x="492" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">6</text>
</g>

<!-- 搜索区间标注 -->
<text x="399" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">lo=4</text>
<text x="511" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#2d9bb3">mid=5</text>
<text x="623" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#187990">hi=6</text>

<line x1="363" y1="208" x2="643" y2="208" stroke="#d8e8ec" stroke-width="1.5"/>
<line x1="363" y1="204" x2="363" y2="212" stroke="#187990" stroke-width="2"/>
<line x1="643" y1="204" x2="643" y2="212" stroke="#187990" stroke-width="2"/>
<line x1="511" y1="204" x2="511" y2="212" stroke="#2d9bb3" stroke-width="2"/>

<rect x="200" y="220" width="320" height="62" rx="8" fill="#187990"/>
<text x="360" y="246" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">比较：nums[mid=5] = 11</text>
<text x="360" y="268" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#dff5f7">11 = target，查找成功！返回下标 5</text>

<rect x="20" y="302" width="78" height="32" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="59" y="323" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#61737c">Step 2</text>

<rect x="610" y="290" width="92" height="44" rx="8" fill="#187990"/>
<text x="656" y="308" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#fff">target = 11</text>
<text x="656" y="328" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#dff5f7">O(log n)</text>
</svg>
