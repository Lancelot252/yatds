<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="斐波那契查找步骤2 - 缩小范围再分割">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">斐波那契查找（Fibonacci Search）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">第二次分割：在右半部分 [11,13]（索引5-6）继续，F(2)=1</text>

<!-- 状态说明 -->
<rect x="30" y="70" width="660" height="30" rx="6" fill="#dff5f7" stroke="#187990" stroke-width="1"/>
<text x="360" y="90" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#187990">lo=5，hi=6，k=4　　新的分割位置 = lo + F(k-2) − 1 = 5 + F(2) − 1 = 5 + 1 − 1 = 5</text>

<!-- 完整数组（灰化前半部分）-->
<g transform="translate(55,120)">
  <text x="45" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#d8e8ec">0</text>
  <text x="135" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#d8e8ec">1</text>
  <text x="225" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#d8e8ec">2</text>
  <text x="315" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#d8e8ec">3</text>
  <text x="405" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#d8e8ec">4</text>
  <text x="495" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#f0a500" font-weight="700">5</text>
  <text x="585" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">6</text>

  <!-- 已排除部分（灰化） -->
  <rect x="0" y="0" width="90" height="52" rx="5" fill="#f2f4f5" stroke="#e8ecee" stroke-width="1.5"/>
  <text x="45" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#d4d8db">1</text>
  <rect x="90" y="0" width="90" height="52" rx="5" fill="#f2f4f5" stroke="#e8ecee" stroke-width="1.5"/>
  <text x="135" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#d4d8db">3</text>
  <rect x="180" y="0" width="90" height="52" rx="5" fill="#f2f4f5" stroke="#e8ecee" stroke-width="1.5"/>
  <text x="225" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#d4d8db">5</text>
  <rect x="270" y="0" width="90" height="52" rx="5" fill="#f2f4f5" stroke="#e8ecee" stroke-width="1.5"/>
  <text x="315" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#d4d8db">7</text>
  <rect x="360" y="0" width="90" height="52" rx="5" fill="#f2f4f5" stroke="#e8ecee" stroke-width="1.5"/>
  <text x="405" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#d4d8db">9</text>

  <!-- 当前 probe：索引 5 -->
  <rect x="450" y="0" width="90" height="52" rx="5" fill="#f0a500" stroke="#c8a800" stroke-width="2.5" filter="url(#sh)"/>
  <text x="495" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">11</text>

  <!-- 右侧最后一个 -->
  <rect x="540" y="0" width="90" height="52" rx="5" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.8"/>
  <text x="585" y="33" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#1d2a2f">13</text>

  <text x="495" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#f0a500">probe=5</text>
</g>

<!-- 比较结果 -->
<rect x="80" y="240" width="560" height="100" rx="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="360" y="265" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">比较：A[5] = 11 = target = 11</text>
<text x="360" y="290" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#187990">目标命中！返回索引 5</text>
<line x1="100" y1="305" x2="620" y2="305" stroke="#d8e8ec" stroke-width="1"/>
<text x="360" y="325" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">关键点：Fibonacci 分割不均等，避免每次取中点，对非均匀数据更友好</text>

<rect x="80" y="348" width="560" height="26" rx="6" fill="#187990"/>
<text x="360" y="366" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#fff">✓ 查找成功，共 2 次比较，时间复杂度 O(log n)</text>

<rect x="20" y="350" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="369" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 2</text>
</svg>
