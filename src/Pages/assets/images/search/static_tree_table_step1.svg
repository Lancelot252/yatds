<svg viewBox="0 0 720 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="静态树表步骤1 - 构造判定树">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
</defs>
<text x="360" y="34" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#187990">静态树表查找（Static Tree Table）</text>
<text x="360" y="55" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">有序关键字 [1,3,5,7,9,11,13] 构造最优判定树（取中间元素为根）</text>

<!-- 有序数组 -->
<g transform="translate(55,84)">
  <text x="310" y="-8" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">有序数组（下标 0–6）</text>
  <rect x="0"   y="0" width="86" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="43"  y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">1</text>
  <rect x="86"  y="0" width="86" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="129" y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">3</text>
  <rect x="172" y="0" width="86" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="215" y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">5</text>
  <rect x="258" y="0" width="86" height="44" rx="5" fill="#187990" stroke="#0d5e6e" stroke-width="2" filter="url(#sh)"/>
  <text x="301" y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">7</text>
  <rect x="344" y="0" width="86" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="387" y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">9</text>
  <rect x="430" y="0" width="86" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="473" y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">11</text>
  <rect x="516" y="0" width="86" height="44" rx="5" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.5"/>
  <text x="559" y="27" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" fill="#61737c">13</text>
  <!-- 标注中间元素 -->
  <text x="301" y="56" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">↑ 根节点（mid=3）</text>
</g>

<!-- 箭头 -->
<text x="360" y="163" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" fill="#2d9bb3">↓ 递归建树</text>

<!-- 判定树 -->
<g transform="translate(0,175)">
  <!-- 层级连线 -->
  <line x1="360" y1="28" x2="220" y2="88" stroke="#2d9bb3" stroke-width="2"/>
  <line x1="360" y1="28" x2="500" y2="88" stroke="#2d9bb3" stroke-width="2"/>
  <line x1="220" y1="110" x2="150" y2="160" stroke="#2d9bb3" stroke-width="1.8"/>
  <line x1="220" y1="110" x2="290" y2="160" stroke="#2d9bb3" stroke-width="1.8"/>
  <line x1="500" y1="110" x2="430" y2="160" stroke="#2d9bb3" stroke-width="1.8"/>
  <line x1="500" y1="110" x2="570" y2="160" stroke="#2d9bb3" stroke-width="1.8"/>

  <!-- 根 7 -->
  <circle cx="360" cy="18" r="22" fill="#187990" stroke="#0d5e6e" stroke-width="2" filter="url(#sh)"/>
  <text x="360" y="25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">7</text>
  <text x="393" y="15" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">深度1</text>

  <!-- 3 和 11 -->
  <circle cx="220" cy="100" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
  <text x="220" y="107" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">3</text>
  <circle cx="500" cy="100" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.8" filter="url(#sh)"/>
  <text x="500" y="107" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">11</text>
  <text x="245" y="97" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">深度2</text>

  <!-- 叶节点 1 5 9 13 -->
  <circle cx="150" cy="172" r="18" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="290" cy="172" r="18" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="290" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1d2a2f">5</text>
  <circle cx="430" cy="172" r="18" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="430" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1d2a2f">9</text>
  <circle cx="570" cy="172" r="18" fill="#dff5f7" stroke="#2d9bb3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="570" y="178" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#1d2a2f">13</text>
  <text x="620" y="169" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#61737c">深度3</text>

  <!-- ASL 说明 -->
  <rect x="110" y="200" width="500" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1"/>
  <text x="360" y="219" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">ASL = (1×1 + 2×2 + 4×3) / 7 = 17/7 ≈ 2.43（最优平衡树，最小平均查找长度）</text>
</g>

<rect x="20" y="380" width="68" height="28" rx="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
<text x="54" y="399" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#61737c">Step 1</text>
</svg>
