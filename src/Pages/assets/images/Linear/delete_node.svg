<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="节点的删除">
<defs>
  <filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#187990" flood-opacity=".08"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b7c1c5"/></marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#187990"/></marker>
</defs>
<rect width="900" height="640" fill="#fff"/>
<circle cx="330" cy="95" r="22" fill="#a8d5c9" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<text x="330" y="101" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" >1</text>
<line x1="358" y1="95" x2="414" y2="95" stroke="#187990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<circle cx="442" cy="95" r="22" fill="#7ec8e3" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<text x="442" y="101" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" >0</text>
<line x1="470" y1="95" x2="526" y2="95" stroke="#187990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<circle cx="554" cy="95" r="22" fill="#a8d5c9" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<text x="554" y="101" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" >3</text>
<text x="330" y="142" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >n0</text>
<text x="442" y="142" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="700" fill="#187990" >P</text>
<text x="554" y="142" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >n1</text>
<text x="626" y="100" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="500" fill="#61737c" >···</text>
<rect x="250" y="210" width="132" height="42" rx="8" fill="#eef6fb" stroke="#d8e8ec" stroke-width="1.2"/>
<text x="316.0" y="236.0" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="700" fill="#1d2a2f" >n0.next = n1</text>
<text x="255" y="284" text-anchor="start" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="500" fill="#1d2a2f" >命令 n0 指向 n1</text>
<line x1="442" y1="160" x2="442" y2="220" stroke="#b7c1c5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="330" cy="325" r="22" fill="#a8d5c9" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<text x="330" y="331" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" >1</text>
<line x1="358" y1="325" x2="414" y2="325" stroke="#187990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<circle cx="442" cy="325" r="22" fill="#7ec8e3" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<text x="442" y="331" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" >0</text>
<line x1="470" y1="325" x2="526" y2="325" stroke="#187990" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<circle cx="554" cy="325" r="22" fill="#a8d5c9" stroke="#187990" stroke-width="2" filter="url(#sh)"/>
<text x="554" y="331" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" >3</text>
<text x="330" y="372" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >n0</text>
<text x="442" y="372" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="700" fill="#187990" >P</text>
<text x="554" y="372" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >n1</text>
<text x="96" y="410" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" font-weight="700" fill="#1d2a2f" >示例</text>
<text x="96" y="442" text-anchor="start" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="500" fill="#1d2a2f" >在链表中删除节点 P</text>
<text x="250" y="515" text-anchor="start" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >删除完成后，虽然 P 仍然指向 n1</text>
<text x="250" y="540" text-anchor="start" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >但遍历链表已经无法访问到 P</text>
<text x="250" y="565" text-anchor="start" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="15" font-weight="500" fill="#61737c" >由此我们认为节点 P 已被删除</text>
</svg>
