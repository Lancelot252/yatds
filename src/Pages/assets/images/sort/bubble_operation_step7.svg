<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="冒泡排序操作步骤7">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".07"/></filter>
</defs>

<!-- 整体内容（可统一调整偏移） -->
<g transform="translate(0, 50)">
<!-- 圆形气泡数组 -->
<g transform="translate(220, 100)">
  <!-- nums 标签 -->
  <text x="-55" y="22" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#187990">nums</text>

  <!-- 气泡1 -->
  <circle cx="30" cy="14" r="18" fill="#a8d5c9" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="30" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>

  <!-- 气泡3 -->
  <circle cx="82" cy="14" r="22" fill="#a8d5c9" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="82" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>

  <!-- 气泡1 -->
  <circle cx="132" cy="14" r="16" fill="#a8d5c9" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="132" y="20" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>

  <!-- 气泡4 -->
  <circle cx="184" cy="14" r="24" fill="#a8d5c9" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="184" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#fff">4</text>

  <!-- 气泡2 -->
  <circle cx="234" cy="14" r="18" fill="#a8d5c9" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="234" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>

  <!-- 气泡5 - 灰色（已排序） -->
  <circle cx="288" cy="14" r="26" fill="#b8c4cc" stroke="#61737c" stroke-width="1.6" filter="url(#sh)"/>
  <text x="288" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#fff">5</text>

  <!-- 水底和水面标注 -->
  <text x="30" y="-25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">水底</text>
  <text x="288" y="-25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">水面</text>

  <!-- 未排序区间括号 -->
  <path d="M 28 32 Q 22 55 130 55 Q 230 55 230 32" stroke="#61737c" stroke-width="1.2" fill="none"/>
  <text x="135" y="72" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">仅剩 <tspan font-weight="700">n-1</tspan> 个元素未排序</text>
</g>

<!-- 连接线：从5到说明框 -->
<path d="M 505 140 L 455 225" stroke="#61737c" stroke-width="1.2" fill="none"/>

<!-- 说明框：遍历完成后 -->
<g transform="translate(320, 200)">
  <rect x="0" y="0" width="200" height="58" rx="10" ry="10" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="100" y="25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">遍历完成后，</text>
  <text x="100" y="46" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">最大的泡泡浮出水面</text>
</g>
</g><!-- end 整体偏移 -->

<!-- Step 标签（不随整体移动） -->
<g transform="translate(20, 370)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 7</text>
</g>
</svg>