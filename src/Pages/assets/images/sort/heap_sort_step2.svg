<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤2">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 从最后一个非叶节点开始建堆</text>

<g transform="translate(160, 42)">
  <text x="190" y="-5" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#61737c">从最后一个非叶节点 (index=2, 值=6) 开始 sift down</text>

  <!-- 树连线 -->
  <line x1="190" y1="26" x2="100" y2="66" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="190" y1="26" x2="280" y2="66" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="100" y1="78" x2="55" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="100" y1="78" x2="145" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="78" x2="255" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="78" x2="325" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>

  <!-- 节点 - 高亮当前处理的节点 -->
  <circle cx="190" cy="14" r="22" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="190" y="20" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">9</text>
  <circle cx="100" cy="68" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="100" y="74" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">4</text>
  <!-- 当前处理节点: 6 -->
  <circle cx="280" cy="68" r="21" fill="#fff3cd" stroke="#e6b04a" stroke-width="2"/><text x="280" y="75" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">6</text>
  <circle cx="55" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="55" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">2</text>
  <circle cx="145" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="145" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">8</text>
  <circle cx="255" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="255" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="325" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="325" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">5</text>

  <!-- 标注 -->
  <path d="M 300 55 L 320 45" stroke="#e6b04a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="50" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#e6b04a">当前节点</text>
</g>

<text x="360" y="205" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">最后一个非叶节点 = floor((n-2)/2) = index 2 (值为 6)</text>
<text x="360" y="228" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">比较 6 与其子节点 [1, 5]，6 &gt;= max(1,5)，无需交换</text>

<g transform="translate(20, 250)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 2</text>
</g>
</svg>