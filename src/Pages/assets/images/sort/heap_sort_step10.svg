<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤10">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 取出 2 归位</text>

<g transform="translate(275, 42)">
  <text x="85" y="-3" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#187990">建堆后 2 为最大值</text>

  <line x1="85" y1="14" x2="50" y2="38" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="85" y1="14" x2="120" y2="38" stroke="#d8e8ec" stroke-width="1.2"/>

  <circle cx="85" cy="4" r="16" fill="#fff3cd" stroke="#e6b04a" stroke-width="2"/><text x="85" y="11" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">2</text>
  <circle cx="50" cy="40" r="14" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="50" y="46" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="120" cy="40" r="14" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="120" y="46" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">-</text>
</g>

<g transform="translate(175, 102)">
  <rect x="0" y="0" width="380" height="32" rx="8" ry="8" fill="#eaf6f8" stroke="#187990" stroke-width="1.3"/>
  <text x="190" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#187990">当前数组: [2, 1 | 4, 5, 6, 8, 9]</text>
</g>

<text x="360" y="162" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">将 2 与末尾元素 1 交换，2 归位</text>

<g transform="translate(20, 182)">
  <rect x="0" y="0" width="92" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="46" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 10</text>
</g>
</svg>