<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤12-完成">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">堆排序 — 排序完成</text>

<!-- 最终有序数组 -->
<g transform="translate(130, 45)">
  <text x="-35" y="24" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <rect x="0" y="0" width="480" height="46" rx="10" ry="10" fill="#eaf6f8" stroke="#187990" stroke-width="2.2"/>
  <rect x="6" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="37" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">1</text>
  <rect x="72" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="103" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">2</text>
  <rect x="138" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="169" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">4</text>
  <rect x="204" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="235" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">5</text>
  <rect x="270" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="301" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">6</text>
  <rect x="336" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="367" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">8</text>
  <rect x="402" y="6" width="62" height="34" rx="6" ry="6" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="433" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#187990">9</text>

  <circle cx="480" cy="23" r="18" fill="#eaf6f8" stroke="#187990" stroke-width="1.8"/>
  <text x="480" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#187990">&#x2713;</text>
</g>

<!-- 算法特性 -->
<g transform="translate(80, 115)">
  <rect x="0" y="0" width="580" height="110" rx="10" ry="10" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.4"/>
  <text x="290" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">堆排序算法特性</text>
  <text x="20" y="44" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">&#x2022; 时间复杂度：始终 O(n log n)，无论输入是否有序</text>
  <text x="20" y="63" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">&#x2022; 空间复杂度：O(1)（原地排序，仅用常数额外空间）</text>
  <text x="20" y="82" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">&#x2022; 不稳定排序（sift down 操作可能改变相等元素的相对顺序）</text>
  <text x="20" y="101" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">&#x2022; 核心操作：建堆 O(n) + 取出堆顶并调整 n 次 = O(n log n)</text>
</g>

<!-- 流程总结 -->
<g transform="translate(80, 240)">
  <rect x="0" y="0" width="580" height="30" rx="6" ry="6" fill="#eaf6f8" stroke="#187990" stroke-width="1.2"/>
  <text x="290" y="20" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#187990">流程总结：建堆 → 循环 n-1 次 { 交换堆顶与末尾 → 堆大小减一 → sift down } → 排序完成</text>
</g>

<g transform="translate(20, 282)">
  <rect x="0" y="0" width="92" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="46" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 12</text>
</g>
</svg>