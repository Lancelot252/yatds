<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤4">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 处理 index=0 (值=9)，已是最大值</text>

<g transform="translate(160, 42)">
  <text x="190" y="-5" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#61737c">处理根节点 index=0，值为 9</text>

  <line x1="190" y1="26" x2="100" y2="66" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="190" y1="26" x2="280" y2="66" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="100" y1="78" x2="55" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="100" y1="78" x2="145" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="78" x2="255" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="78" x2="325" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>

  <!-- 根节点高亮 -->
  <circle cx="190" cy="14" r="23" fill="#fff3cd" stroke="#e6b04a" stroke-width="2.2"/><text x="190" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">9</text>
  <circle cx="100" cy="68" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="100" y="74" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">8</text>
  <circle cx="280" cy="68" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="280" y="74" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">6</text>
  <circle cx="55" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="55" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">2</text>
  <circle cx="145" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="145" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="255" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="255" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="325" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="325" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">5</text>
</g>

<text x="360" y="195" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">9 &gt;= max(8, 6) = 8，满足堆性质，无需交换</text>
<text x="360" y="218" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">建堆完成！当前为大顶堆，根节点 9 为最大元素</text>

<!-- 大顶堆标记 -->
<g transform="translate(270, 240)">
  <rect x="0" y="0" width="180" height="34" rx="8" ry="8" fill="#eaf6f8" stroke="#187990" stroke-width="1.4"/>
  <text x="90" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#187990">&#x2713; 大顶堆构建完成</text>
</g>

<g transform="translate(20, 245)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 4</text>
</g>
</svg>