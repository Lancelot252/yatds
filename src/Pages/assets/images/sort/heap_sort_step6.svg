<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤6">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 重新建堆，取出 8 放到末尾</text>

<g transform="translate(170, 40)">
  <text x="180" y="-3" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#187990">重新建堆后：8 为新的最大值</text>

  <line x1="180" y1="22" x2="100" y2="56" stroke="#d8e8ec" stroke-width="1.4"/>
  <line x1="180" y1="22" x2="260" y2="56" stroke="#d8e8ec" stroke-width="1.4"/>
  <line x1="100" y1="65" x2="55" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>
  <line x1="100" y1="65" x2="145" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>
  <line x1="260" y1="65" x2="235" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>

  <!-- 5 sift down 后 8 到了根 -->
  <circle cx="180" cy="12" r="20" fill="#fff3cd" stroke="#e6b04a" stroke-width="2"/><text x="180" y="18" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">8</text>
  <circle cx="100" cy="60" r="18" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="100" y="66" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">5</text>
  <circle cx="260" cy="60" r="18" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="260" y="66" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">6</text>
  <circle cx="55" cy="106" r="15" fill="#dff5f7" stroke="#187990" stroke-width="1.1"/><text x="55" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">2</text>
  <circle cx="145" cy="106" r="15" fill="#dff5f7" stroke="#187990" stroke-width="1.1"/><text x="145" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="235" cy="106" r="15" fill="#dff5f7" stroke="#187990" stroke-width="1.1"/><text x="235" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">1</text>
</g>

<!-- 结果 -->
<g transform="translate(140, 168)">
  <rect x="0" y="0" width="460" height="40" rx="8" ry="8" fill="#eaf6f8" stroke="#187990" stroke-width="1.4"/>
  <text x="230" y="25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#187990">当前数组状态: [8, 5, 6, 2, 4, 1 | 9] (9 已归位)</text>
</g>

<text x="360" y="232" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">将堆顶 8 与末尾元素 1 交换，8 归位到倒数第二位置</text>

<g transform="translate(20, 248)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 6</text>
</g>
</svg>