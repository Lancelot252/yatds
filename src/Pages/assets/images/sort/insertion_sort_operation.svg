<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="插入排序整体流程">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<!-- ===== 左侧区域 ===== -->
<g transform="translate(10, 85)">
  <!-- 说明文字（两行） -->
  <text x="145" y="0" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#61737c">将元素 <tspan font-weight="700" fill="#187990">3</tspan> 插入到 <tspan font-weight="700" fill="#187990">nums</tspan></text>
  <text x="145" y="18" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#61737c">已排序区间的正确位置</text>

  <!-- 数组 -->
  <g transform="translate(8, 58)">
    <rect x="0" y="0" width="274" height="46" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.5"/>
    <!-- 普通元素(绿) -->
    <rect x="4" y="4" width="42" height="38" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="25" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
    <rect x="50" y="4" width="42" height="38" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="71" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
    <rect x="96" y="4" width="42" height="38" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="117" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
    <rect x="142" y="4" width="42" height="38" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="163" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
    <rect x="188" y="4" width="42" height="38" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="209" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">5</text>
    <!-- base 元素(青色高亮) -->
    <rect x="228" y="4" width="42" height="38" rx="6" ry="6" fill="#7ec8e3" stroke="#187990" stroke-width="1.8"/><text x="249" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>

    <!-- 插入位置虚线 -->
    <line x1="138" y1="-5" x2="138" y2="-25" stroke="#888" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- 从 base 到插入位置的弧线箭头 -->
    <path d="M 255 -3 C 260 -30, 142 -30,140 -3" stroke="#777" stroke-width="1.4" fill="none"/>
    <polygon points="136,-5 144,-5 140,0" fill="#777"/>
  </g>

  <!-- 向右大箭头 -->
  <g transform="translate(305, 78)">
    <polygon points="-14,-14 14,-14 20,0 14,14 -14,14 -20,0" fill="#ccc"/>
    <path d="M -7,0 L 7,0 M 0,-7 L 7,0 L 0,7" stroke="#fff" stroke-width="2.2" fill="none"/>
  </g>
</g>

<!-- ===== 右侧：圆角矩形框 ===== -->
<g transform="translate(340, 8)">
  

  <!-- 第0行：初始 + 暂存base -->
  <g transform="translate(28, 18)">
    <rect x="0" y="0" width="310" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.4"/>
    <rect x="4" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="27" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="54" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="77" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="104" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="127" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">2</text>
    <rect x="154" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="177" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">4</text>
    <rect x="204" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="227" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">5</text>
    <rect x="254" y="4" width="46" height="36" rx="6" ry="6" fill="#7ec8e3" stroke="#187990" stroke-width="1.8"/><text x="277" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">3</text>
    <!-- 暂存标签 -->
    <text x="330" y="22" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#61737c">暂存</text>
    <text x="330" y="40" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#187990">base</text>
  </g>

  <!-- 左侧大括号：先将元素依次向后移动一位（覆盖第1、2行） -->
  <path d="M 20 42 Q 12 42 12 52 L 12 198 Q 12 208 20 208" stroke="#bbb" stroke-width="1.3" fill="none"/>
  <text x="10" y="100" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#999">先将元素依次</text>
  <text x="10" y="116" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#999">向后移动一位</text>

  <!-- 箭头0→1 -->
  <line x1="177" y1="68" x2="177" y2="100" stroke="#aaa" stroke-width="1.3"/>
  <polygon points="173,95 181,95 177,100" fill="#aaa"/>

  <!-- 第1行：nums[5] = nums[4] -->
  <g transform="translate(28, 104)">
    <rect x="0" y="0" width="310" height="42" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.2"/>
    <rect x="4" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="27" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="54" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="77" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="104" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="127" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="154" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="177" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="204" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="227" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">5</text>
    <rect x="254" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="277" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">5</text>
    <!-- 小移动箭头 5→5 -->
    <path d="M 225 -2 C 225 -16, 270 -16, 270 -2" stroke="#999" stroke-width="1.3" fill="none"/>
    <polygon points="265,-6 272,-6 270,-2" fill="#999"/>
    <!-- 标签 -->
    <text x="165" y="-20" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#666">nums[5] = nums[4]</text>
  </g>

  <!-- 箭头1→2 -->
  <line x1="177" y1="150" x2="177" y2="180" stroke="#aaa" stroke-width="1.3"/>
  <polygon points="173,175 181,175 177,180" fill="#aaa"/>

  <!-- 第2行：nums[4] = nums[3] -->
  <g transform="translate(28, 186)">
    <rect x="0" y="0" width="310" height="42" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.2"/>
    <rect x="4" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="27" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="54" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="77" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">1</text>
    <rect x="104" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="127" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">2</text>
    <rect x="154" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="177" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="204" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="227" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">4</text>
    <rect x="254" y="4" width="46" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.1"/><text x="277" y="26" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#fff">5</text>
    <!-- 小移动箭头 4→4 -->
    <path d="M 175 -2 C 175 -16, 224 -16, 224 -2" stroke="#999" stroke-width="1.3" fill="none"/>
    <polygon points="220,-4 227,-4 224,0" fill="#999"/>
    <!-- 标签 -->
    <text x="165" y="-20" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#666">nums[4] = nums[3]</text>
  </g>

  <!-- 虚线曲线箭头：从第2行到第3行 -->
  <path d="M 370 62 C 365 290, 250 220, 200 265" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4,3"/>
  <polygon points="201,256 212,262 203,266" fill="#bbb"/>

  <!-- 左侧大括号：再将元素赋给目标索引（覆盖第3行） -->
  <path d="M 20 256 Q 12 256 12 266 L 12 300 Q 12 310 20 310" stroke="#bbb" stroke-width="1.3" fill="none"/>
  <text x="10" y="276" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#999">再将元素赋</text>
  <text x="10" y="292" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#999">给目标索引</text>

  <line x1="177" y1="228" x2="177" y2="260" stroke="#aaa" stroke-width="1.3"/>
  <polygon points="173,255 181,255 177,260" fill="#aaa"/>

  <!-- 第3行：最终结果 nums[3] = base -->
  <g transform="translate(28, 264)">
    <rect x="0" y="0" width="310" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.4"/>
    <rect x="4" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="27" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="54" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="77" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="104" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="127" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">2</text>
    <!-- base 放入目标位置(青色) -->
    <rect x="154" y="4" width="46" height="36" rx="6" ry="6" fill="#7ec8e3" stroke="#187990" stroke-width="1.8"/><text x="177" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">3</text>
    <rect x="204" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="227" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">4</text>
    <rect x="254" y="4" width="46" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="277" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#fff">5</text>
    <!-- 标签 -->
    <text x="165" y="-20" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="11.5" fill="#666">nums[3] = base</text>
  </g>
</g>
</svg>