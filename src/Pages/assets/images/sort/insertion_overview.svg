<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="插入排序操作过程">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<!-- 已排序区间标题 -->
<text x="100" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#61737c">已排序区间</text>

<!-- ===== 第 0 行：初始状态 ===== -->
<g transform="translate(180, 15)">
  <text x="-70" y="40" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#61737c">[0, 0]</text>
  <rect x="0" y="10" width="330" height="40" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.4"/>
  <!-- 已排序(灰): 只有第1个元素 -->
  <rect x="4" y="14" width="48" height="32" rx="5" ry="5" fill="#b8c4cc" stroke="#61737c" stroke-width="1.2"/><text x="28" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
  <!-- 待插入(青色高亮) -->
