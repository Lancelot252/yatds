  <rect x="160" y="14" width="48" height="32" rx="5" ry="5" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="184" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <rect x="212" y="14" width="48" height="32" rx="5" ry="5" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="236" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">5</text>
  <rect x="264" y="14" width="48" height="32" rx="5" ry="5" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="288" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
</g>

<!-- 箭头0→1 + 文字 -->
