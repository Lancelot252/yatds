<polygon points="206,97 215,97 211,102" fill="#999"/>
<text x="260" y="90" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#61737c">执行第 1 轮插入</text>

