<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="归并排序步骤6">

<!-- ====== 左侧：递归划分 + 回溯合并 大括号区域 ====== -->
<g transform="translate(0, 0)">

  <!-- 递归划分 - 上大括号 -->
  <path d="M 210,55 Q 230,55 230,75 L 230,130 Q 230,145 245,145 Q 230,145 230,160 L 230,215 Q 230,235 210,235" stroke="#bbb" stroke-width="1.5" fill="none"/>
  <text x="195" y="150" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#444">递归划分</text>

  <!-- 虚线分隔 -->
  <line x1="250" y1="238" x2="520" y2="238" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 触发递归 / 终止条件 -->
  <text x="530" y="232" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#555">触发递归</text>
  <text x="530" y="252" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#555">终止条件</text>

  <!-- 回溯合并 - 下大括号 -->
  <path d="M 210,245 Q 230,245 230,265 L 230,320 Q 230,335 245,335 Q 230,335 230,350 L 230,365 Q 230,385 210,385" stroke="#bbb" stroke-width="1.5" fill="none"/>
  <text x="195" y="340" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#444">回溯合并</text>

</g>

<!-- ====== 中间：递归树 ====== -->
<g transform="translate(0, 0)">

  <!-- L0: [7,3,2,6] -->
  <g transform="translate(340, 62)">
    <rect x="0" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="20" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">7</text>
    <rect x="44" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="64" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
    <rect x="88" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="108" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
    <rect x="132" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="152" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">6</text>
  </g>

  <!-- 分叉箭头 L0 -> [7,3] 和 [2,6] -->
  <line x1="420" y1="98" x2="360" y2="128" stroke="#999" stroke-width="1.5"/>
  <polygon points="356,124 366,128 360,132" fill="#999"/>
  <line x1="420" y1="98" x2="480" y2="128" stroke="#999" stroke-width="1.5"/>
  <polygon points="472,128 483,126 480,132" fill="#999"/>

  <!-- L1-左: [7,3] -->
  <g transform="translate(340, 134)">
    <rect x="0" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="20" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">7</text>
    <rect x="44" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="64" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  </g>

  <!-- L1-右: [2,6] -->
  <g transform="translate(460, 134)">
    <rect x="0" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="20" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
    <rect x="44" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="64" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">6</text>
  </g>

  <!-- 分叉箭头 L1 -> [7] 和 [3] -->
  <line x1="380" y1="170" x2="360" y2="200" stroke="#999" stroke-width="1.5"/>
  <polygon points="358,196 366,196 362,204" fill="#999"/>
  <line x1="380" y1="170" x2="400" y2="200" stroke="#999" stroke-width="1.5"/>
  <polygon points="394,196 402,196 398,204" fill="#999"/>

  <!-- L2: [7] 和 [3] 叶子 -->
  <g transform="translate(340, 206)">
    <rect x="0" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="20" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">7</text>
  </g>
  <g transform="translate(380, 206)">
    <rect x="0" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="20" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  </g>

  <!-- ====== 回溯合并区 ====== -->

  <!-- 合并箭头: [7]+[3] -> [3,7] -->
  <line x1="360" y1="242" x2="405" y2="278" stroke="#999" stroke-width="1.5"/>
  <polygon points="398,279 407,274 405,282" fill="#999"/>
  <line x1="400" y1="242" x2="355" y2="278" stroke="#999" stroke-width="1.5"/>
  <polygon points="351,273 360,277 354,282" fill="#999"/>

  <!-- M1: [3,7] 合并结果 -->
  <g transform="translate(340, 284)">
    <rect x="0" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="20" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
    <rect x="44" y="0" width="40" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#6ba87a" stroke-width="1.3"/><text x="64" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">7</text>
  </g>

</g>

<!-- ====== 底部：Step标签 + 来源 ====== -->
<g transform="translate(25, 385)">
  <rect x="0" y="0" width="78" height="32" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#888">Step 6</text>
</g>


</svg>