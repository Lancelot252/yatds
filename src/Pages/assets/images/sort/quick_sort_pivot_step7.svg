<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="快速排序步骤7">
<g transform="translate(20, 15)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 7</text>
</g>
<text x="250" y="32" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#187990">基准数</text>
<text x="250" y="56" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#61737c">left</text>
<line x1="250" y1="60" x2="250" y2="70" stroke="#61737c" stroke-width="1.2"/><polygon points="246,68 254,68 250,74" fill="#61737c"/>
<text x="510" y="56" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#61737c">right</text>
<line x1="510" y1="60" x2="510" y2="70" stroke="#61737c" stroke-width="1.2"/><polygon points="506,68 514,68 510,74" fill="#61737c"/>
<g transform="translate(220, 68)">
  <text x="-56" y="30" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <rect x="0" y="8" width="330" height="42" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.5"/>
  <rect x="4" y="12" width="48" height="34" rx="6" ry="6" fill="#7ec8e3" stroke="#187990" stroke-width="1.6"/><text x="28" y="35" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <rect x="56" y="12" width="48" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="80" y="35" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">0</text>
  <rect x="108" y="12" width="48" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="132" y="35" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <rect x="160" y="12" width="48" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="184" y="35" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
  <rect x="212" y="12" width="48" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="236" y="35" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <rect x="264" y="12" width="48" height="34" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.2"/><text x="288" y="35" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">5</text>
  <line x1="132" y1="54" x2="132" y2="64" stroke="#187990" stroke-width="1.5"/><polygon points="128,64 136,64 132,72" fill="#187990"/>
  <text x="132" y="86" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">j</text>
  <text x="132" y="100" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">i</text>
</g>

<!-- 代码块 -->
<g transform="translate(30, 170)">
<rect x="0" y="0" width="660" height="250" rx="10" ry="10" fill="#f7f8fa" stroke="#e2e6ea" stroke-width="1.2"/>
<!-- L1: def partition -->
<text x="24" y="22"><tspan font-family="'Consolas','Courier New',monospace" font-size="13" font-weight="600" fill="#c0392b">def</tspan><tspan font-family="'Consolas','Courier New',monospace" font-size="13" fill="#333"> partition(nums, left, right):</tspan></text>

<!-- L2: 哨兵划分 -->
<text x="36" y="42" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#555">"""哨兵划分"""</text>

<!-- L3: i,j = left,right -->
<text x="36" y="64" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#333">i, j = left, right</text>
<text x="395" y="64" font-family="'Consolas','Courier New',monospace'" font-size="11" fill="#999"># 以 nums[left] 为基准数</text>

<!-- L4: while i<j -->
<text x="36" y="84"><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#c0392b">while </tspan><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">i &lt; j:</tspan></text>

<!-- L5: while j -->
<text x="60" y="104"><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#c0392b">while </tspan><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">i &lt; j and nums[j] ≥ nums[left]:</tspan></text>
<text x="395" y="104" font-family="'Consolas','Courier New',monospace'" font-size="11" fill="#999"># 从右向左找首个小于基准数的元素</text>

<!-- L6: j-=1 -->
<text x="85" y="124" font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">j -= 1</text>

<!-- L7: while i -->
<text x="60" y="144"><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#c0392b">while </tspan><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">i &lt; j and nums[i] ≤ nums[left]:</tspan></text>
<text x="395" y="144" font-family="'Consolas','Courier New',monospace'" font-size="11" fill="#999"># 从左向右找首个大于基准数的元素</text>

<!-- L8: i+=1 -->
<text x="85" y="164" font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">i += 1</text>

<!-- L9: swap ij (高亮 自交换) -->
<rect x="42" y="172" width="270" height="18" rx="3" ry="3" fill="#e8e8e8"/>
<text x="60" y="184" font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">nums[i], nums[j] = nums[j], nums[i]</text>
<text x="395" y="184" font-family="'Consolas','Courier New',monospace'" font-size="11" fill="#999"># 交换这两个元素</text>

<!-- L10: pivot归位 -->
<text x="36" y="204" font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">nums[i], nums[left] = nums[left], nums[i]</text>
<text x="395" y="204" font-family="'Consolas','Courier New',monospace'" font-size="11" fill="#999"># 将基准数交换至两子数组的分界线</text>

<!-- L11: return -->
<text x="24" y="224"><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#c0392b">return </tspan><tspan font-family="'Consolas','Courier New',monospace'" font-size="13" fill="#333">i</tspan></text>
<text x="395" y="224" font-family="'Consolas','Courier New',monospace'" font-size="11" fill="#999"># 返回基准数的索引</text>
</g>
</svg>