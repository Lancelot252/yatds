<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤11">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 剩余最后一个元素 1</text>

<g transform="translate(300, 42)">
  <text x="55" y="-3" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#187990">只剩一个元素</text>

  <circle cx="55" cy="10" r="18" fill="#eaf6f8" stroke="#187990" stroke-width="1.8"/><text x="55" y="17" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">1</text>
</g>

<g transform="translate(165, 82)">
  <rect x="0" y="0" width="400" height="32" rx="8" ry="8" fill="#eaf6f8" stroke="#187990" stroke-width="1.4"/>
  <text x="200" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#187990">当前数组: [1 | 2, 4, 5, 6, 8, 9]</text>
</g>

<text x="360" y="142" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">只剩最后一个元素 1，自然有序，无需操作</text>

<g transform="translate(20, 162)">
  <rect x="0" y="0" width="92" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="46" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 11</text>
</g>
</svg>