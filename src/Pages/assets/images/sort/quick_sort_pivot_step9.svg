<!-- 基准数标题 -->
<text x="358" y="36" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#187990">基准数</text>
<line x1="358" y1="42" x2="358" y2="52" stroke="#187990" stroke-width="1.2"/><polygon points="354,50 362,50 358,56" fill="#187990"/>

<!-- 数组 -->
