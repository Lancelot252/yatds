<!-- 说明文字 -->
<text x="360" y="190" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#333">"哨兵划分" 完成后，满足以下条件</text>

<!-- 条件公式框 -->
<g transform="translate(120, 210)">
  <rect x="0" y="0" width="480" height="38" rx="6" ry="6" fill="#f0f2f4" stroke="#d8e8ec" stroke-width="1.2"/>
  <text x="240" y="25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#333">
    <tspan fill="#187990" font-weight="700">左子数组任意元素</tspan> ≤ <tspan fill="#187990" font-weight="700">基准数</tspan> ≤ <tspan fill="#187990" font-weight="700">右子数组任意元素</tspan>
  </text>
