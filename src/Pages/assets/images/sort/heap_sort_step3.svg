<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤3">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 处理 index=1 (值=4)，需要交换</text>

<g transform="translate(160, 42)">
  <text x="190" y="-5" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#61737c">处理 index=1，子节点为 2 和 8，max=8 &gt; 4 → 需要交换</text>

  <line x1="190" y1="26" x2="100" y2="66" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="190" y1="26" x2="280" y2="66" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="100" y1="78" x2="55" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="100" y1="78" x2="145" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="78" x2="255" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="78" x2="325" y2="116" stroke="#d8e8ec" stroke-width="1.2"/>

  <circle cx="190" cy="14" r="22" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="190" y="20" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">9</text>
  <!-- 当前处理: 4 -->
  <circle cx="100" cy="68" r="21" fill="#fff3cd" stroke="#e6b04a" stroke-width="2"/><text x="100" y="75" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="280" cy="68" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="280" y="74" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">6</text>
  <circle cx="55" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="55" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">2</text>
  <!-- 子节点中最大的: 8 -->
  <circle cx="145" cy="126" r="19" fill="#fdf2f0" stroke="#c75c5c" stroke-width="1.7"/><text x="145" y="132" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">8</text>
  <circle cx="255" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="255" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="325" cy="126" r="17" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="325" y="131" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">5</text>

  <!-- 交换箭头 -->
  <path d="M 110 85 Q 125 105 140 118" stroke="#e6b04a" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <polygon points="136,114 144,118 139,124" fill="#e6b04a"/>
</g>

<text x="360" y="202" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">4 &lt; max(2, 8) = 8，将 4 和 8 交换</text>
<text x="360" y="225" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">交换后继续对交换后的位置做 sift down 检查</text>

<g transform="translate(20, 248)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 3</text>
</g>
</svg>