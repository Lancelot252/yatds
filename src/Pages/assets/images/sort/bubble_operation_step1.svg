<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="冒泡排序操作步骤1">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#187990" flood-opacity=".07"/></filter>
  <radialGradient id="bgGrad" cx="35%" cy="35%"><stop offset="0%" stop-color="#eaf6f8"/><stop offset="100%" stop-color="#dff5f7"/></radialGradient>
</defs>

<!-- 第一行：圆形气泡数组 -->
<g transform="translate(220, 50)">
  <text x="-55" y="22" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <circle cx="30" cy="14" r="26" fill="url(#bgGrad)" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="30" y="21" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="80" cy="18" r="16" fill="url(#bgGrad)" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="80" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">1</text>
  <circle cx="128" cy="16" r="22" fill="url(#bgGrad)" stroke="#187990" stroke-width="1.5" filter="url(#sh)"/>
  <text x="128" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">3</text>
  <circle cx="174" cy="19" r="15" fill="url(#bgGrad)" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="174" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#1d2a2f">1</text>
  <circle cx="222" cy="11" r="28" fill="url(#bgGrad)" stroke="#187990" stroke-width="1.6" filter="url(#sh)"/>
  <text x="222" y="18" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#1d2a2f">5</text>
  <circle cx="270" cy="17" r="18" fill="url(#bgGrad)" stroke="#187990" stroke-width="1.4" filter="url(#sh)"/>
  <text x="270" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">2</text>
</g>

<!-- 向上大箭头 -->
<path d="M 360 156 L 360 120" stroke="#61737c" stroke-width="3" fill="none"/>
<polygon points="354,126 366,126 360,114" fill="#61737c"/>

<!-- 说明文字框 -->
<g transform="translate(280, 162)">
  <rect x="0" y="0" width="260" height="64" rx="8" ry="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
  <text x="130" y="25" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">将数组想象成一排"气泡"</text>
  <text x="130" y="48" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">元素大小与气泡体积成正比</text>
</g>

<!-- 第二行：矩形数组 -->
<g transform="translate(220, 264)">
  <text x="-55" y="27" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <rect x="0" y="0" width="310" height="46" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.8"/>
  <rect x="4" y="4" width="48" height="38" rx="5" ry="5" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/>
  <text x="28" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">4</text>
  <rect x="56" y="4" width="48" height="38" rx="5" ry="5" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/>
  <text x="80" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">1</text>
  <rect x="108" y="4" width="48" height="38" rx="5" ry="5" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/>
  <text x="132" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">3</text>
  <rect x="160" y="4" width="48" height="38" rx="5" ry="5" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/>
  <text x="184" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">1</text>
  <rect x="212" y="4" width="48" height="38" rx="5" ry="5" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/>
  <text x="236" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">5</text>
  <rect x="258" y="4" width="48" height="38" rx="5" ry="5" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/>
  <text x="282" y="29" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">2</text>
</g>

<!-- 左下角 Step 标签 -->
<g transform="translate(20, 340)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 1</text>
</g>
</svg>