<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="选择排序步骤1">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<!-- 数组 -->
<g transform="translate(200, 60)">
  <text x="-50" y="25" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <rect x="0" y="0" width="330" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.6"/>
  <!-- 4 - 普通 -->
  <rect x="4" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="28" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <!-- 1 - 高亮(k) -->
  <rect x="56" y="4" width="48" height="36" rx="6" ry="6" fill="#fff3cd" stroke="#e6b04a" stroke-width="2"/><text x="80" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#1d2a2f">1</text>
  <!-- 3 - 普通 -->
  <rect x="108" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="132" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">3</text>
  <!-- 1 - 普通 -->
  <rect x="160" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="184" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <!-- 5 - 普通 -->
  <rect x="212" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="236" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">5</text>
  <!-- 2 - 普通 -->
  <rect x="264" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="288" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>

  <!-- 未排序区间括号（在数组上方） -->
  <path d="M 8 -8 Q 14 -20 158 -20 Q 296 -20 302 -8" stroke="#61737c" stroke-width="1.4" fill="none"/>
  <text x="155" y="-28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">未排序区间</text>

  <!-- i 和 k 指针 -->
  <line x1="28" y1="48" x2="28" y2="58" stroke="#187990" stroke-width="1.5"/>
  <polygon points="24,58 32,58 28,64" fill="#187990"/>
  <text x="28" y="78" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">i</text>

  <line x1="80" y1="48" x2="80" y2="58" stroke="#e6b04a" stroke-width="1.5"/>
  <polygon points="76,58 84,58 80,64" fill="#e6b04a"/>
  <text x="80" y="78" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#e6b04a">k</text>
</g>

<!-- 说明文字 -->
<text x="200" y="185" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#1d2a2f">第 <tspan font-weight="700">1</tspan> 轮选择：</text>
<g transform="translate(190, 222)">
  <rect x="0" y="0" width="350" height="36" rx="8" ry="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
  <text x="175" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">遍历未排序区间，选择最小元素 <tspan font-weight="600" fill="#187990">nums[k]</tspan></text>
</g>

<!-- Step 标签 -->
<g transform="translate(20, 275)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 1</text>
</g>
</svg>