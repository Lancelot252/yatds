<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="选择排序步骤10">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<!-- 数组 -->
<g transform="translate(200, 55)">
  <text x="-50" y="25" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#187990">nums</text>
  <rect x="0" y="0" width="330" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.6"/>
  <!-- 已排序(灰) -->
  <rect x="4" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="28" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <rect x="56" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="80" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <rect x="108" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="132" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>
  <rect x="160" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="184" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">3</text>
  <!-- 未排序 -->
  <rect x="212" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="236" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <rect x="264" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="288" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">5</text>

  <!-- 未排序区间括号（在数组上方） -->
  <path d="M 216 -8 Q 222 -20 240 -20 Q 296 -20 302 -8" stroke="#61737c" stroke-width="1.4" fill="none"/>
  <text x="259" y="-28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">未排序区间</text>

  <!-- 交换箭头：4和5之间（下方弧线） -->
  <path d="M 236 2 C 236 -18, 288 -18, 288 2" stroke="#e6b04a" stroke-width="1.5" fill="none"/>
  <polygon points="232,0 236,6 240,0" fill="#e6b04a"/>
  <path d="M 236 52 C 236 68, 288 68, 288 52" stroke="#e6b04a" stroke-width="1.5" fill="none"/>
  <polygon points="284,54 292,50 288,60" fill="#e6b04a"/>
</g>

<!-- 说明文字 -->
<text x="200" y="175" text-anchor="start" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#1d2a2f">第 <tspan font-weight="700">5</tspan> 轮选择：</text>
<g transform="translate(190, 210)">
  <rect x="0" y="0" width="350" height="34" rx="8" ry="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
  <text x="175" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">遍历未排序区间，选择最小元素 <tspan font-weight="600" fill="#187990">nums[k]</tspan></text>
</g>
<g transform="translate(190, 255)">
  <rect x="0" y="0" width="350" height="34" rx="8" ry="8" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.2"/>
  <text x="175" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#61737c">交换最小元素 <tspan font-weight="600" fill="#e6b04a">nums[k]</tspan> 和未排序区间的首个元素 <tspan font-weight="600" fill="#187990">nums[i]</tspan></text>
</g>

<!-- Step 标签 -->
<g transform="translate(20, 300)">
  <rect x="0" y="0" width="85" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="42" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 10</text>
</g>
</svg>