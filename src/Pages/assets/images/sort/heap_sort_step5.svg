<svg viewBox="0 0 720 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤5">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 取出堆顶最大值，放到末尾</text>

<!-- 上半部分：大顶堆状态 -->
<g transform="translate(160, 38)">
  <text x="190" y="-3" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#187990">大顶堆状态</text>

  <line x1="190" y1="22" x2="100" y2="58" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="190" y1="22" x2="280" y2="58" stroke="#d8e8ec" stroke-width="1.5"/>
  <line x1="100" y1="68" x2="55" y2="102" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="100" y1="68" x2="145" y2="102" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="68" x2="255" y2="102" stroke="#d8e8ec" stroke-width="1.2"/>
  <line x1="280" y1="68" x2="325" y2="102" stroke="#d8e8ec" stroke-width="1.2"/>

  <circle cx="190" cy="12" r="22" fill="#fff3cd" stroke="#e6b04a" stroke-width="2.2"/><text x="190" y="19" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">9</text>
  <circle cx="100" cy="62" r="19" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="100" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">8</text>
  <circle cx="280" cy="62" r="19" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="280" y="68" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">6</text>
  <circle cx="55" cy="112" r="16" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="55" y="117" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">2</text>
  <circle cx="145" cy="112" r="16" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="145" y="117" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="255" cy="112" r="16" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="255" y="117" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="325" cy="112" r="16" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="325" y="117" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">5</text>
</g>

<!-- 箭头：取出 9 放到末尾 -->
<g transform="translate(370, 165)">
  <line x1="0" y1="0" x2="0" y2="25" stroke="#e6b04a" stroke-width="2.5"/>
  <polygon points="-4,21 4,21 0,29" fill="#e6b04a"/>
  <text x="25" y="16" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#e6b04a">交换 9 和末尾元素</text>
</g>

<!-- 下半部分：交换后数组状态 -->
<g transform="translate(160, 205)">
  <text x="190" y="-3" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#61737c">交换后：9 已归位（末尾），剩余元素需重新建堆</text>

  <line x1="190" y1="22" x2="100" y2="56" stroke="#d8e8ec" stroke-width="1.3"/>
  <line x1="190" y1="22" x2="280" y2="56" stroke="#d8e8ec" stroke-width="1.3"/>
  <line x1="100" y1="65" x2="55" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>
  <line x1="100" y1="65" x2="145" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>
  <line x1="280" y1="65" x2="255" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>
  <line x1="280" y1="65" x2="325" y2="96" stroke="#d8e8ec" stroke-width="1.1"/>

  <!-- 新的根是原来的末尾元素 5 -->
  <circle cx="190" cy="12" r="20" fill="#dff5f7" stroke="#187990" stroke-width="1.5"/><text x="190" y="18" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">5</text>
  <circle cx="100" cy="60" r="18" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="100" y="66" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">8</text>
  <circle cx="280" cy="60" r="18" fill="#dff5f7" stroke="#187990" stroke-width="1.3"/><text x="280" y="66" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">6</text>
  <circle cx="55" cy="106" r="15" fill="#dff5f7" stroke="#187990" stroke-width="1.1"/><text x="55" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">2</text>
  <circle cx="145" cy="106" r="15" fill="#dff5f7" stroke="#187990" stroke-width="1.1"/><text x="145" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="255" cy="106" r="15" fill="#eaf6f8" stroke="#187990" stroke-width="1.1"/><text x="255" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#187990">1</text>
  <!-- 9 归位 -->
  <circle cx="325" cy="106" r="15" fill="#eaf6f8" stroke="#187990" stroke-width="1.6"/><text x="325" y="111" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#187990">9</text>
  <text x="350" y="111" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#187990">&#x2713;</text>
</g>

<g transform="translate(20, 270)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 5</text>
</g>
</svg>