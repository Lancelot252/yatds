<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="堆排序步骤8">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<text x="360" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1d2a2f">堆排序 — 取出 5 归位</text>

<g transform="translate(220, 42)">
  <text x="130" y="-3" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" font-weight="600" fill="#187990">建堆后 5 为最大值</text>

  <line x1="130" y1="18" x2="75" y2="48" stroke="#d8e8ec" stroke-width="1.3"/>
  <line x1="130" y1="18" x2="185" y2="48" stroke="#d8e8ec" stroke-width="1.3"/>
  <line x1="75" y1="55" x2="48" y2="80" stroke="#d8e8ec" stroke-width="1.1"/>

  <circle cx="130" cy="8" r="18" fill="#fff3cd" stroke="#e6b04a" stroke-width="2"/><text x="130" y="15" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1d2a2f">5</text>
  <circle cx="75" cy="50" r="16" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="75" y="56" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">4</text>
  <circle cx="185" cy="50" r="16" fill="#dff5f7" stroke="#187990" stroke-width="1.2"/><text x="185" y="56" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1d2a2f">1</text>
  <circle cx="48" cy="84" r="13" fill="#dff5f7" stroke="#187990" stroke-width="1.1"/><text x="48" y="89" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#1d2a2f">2</text>
</g>

<g transform="translate(140, 148)">
  <rect x="0" y="0" width="460" height="34" rx="8" ry="8" fill="#eaf6f8" stroke="#187990" stroke-width="1.3"/>
  <text x="230" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#187990">当前数组: [5, 4, 1, 2 | 6, 8, 9]</text>
</g>

<text x="360" y="210" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">将 5 与末尾元素 2 交换，5 归位</text>

<g transform="translate(20, 228)">
  <rect x="0" y="0" width="78" height="34" rx="6" ry="6" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="39" y="23" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#61737c">Step 8</text>
</g>
</svg>