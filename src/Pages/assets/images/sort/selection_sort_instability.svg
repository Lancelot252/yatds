<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="选择排序不稳定性示例">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<!-- ===== 第一行：初始状态 ===== -->
<g transform="translate(360, 80)">
  <!-- 未排序区间括号（在数组上方） -->
  <path d="M 8 -8 Q 14 -20 158 -20 Q 296 -20 302 -8" stroke="#61737c" stroke-width="1.4" fill="none"/>
  <text x="155" y="-28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">未排序区间</text>

  <rect x="0" y="0" width="330" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.6"/>
  <!-- 两个 4 用不同蓝色区分 -->
  <rect x="4" y="4" width="48" height="36" rx="6" ry="6" fill="#7eb6e8" stroke="#187990" stroke-width="1.3"/><text x="28" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
  <rect x="56" y="4" width="48" height="36" rx="6" ry="6" fill="#6b85d4" stroke="#187990" stroke-width="1.3"/><text x="80" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
  <!-- 其余绿色 -->
  <rect x="108" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="132" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
  <rect x="160" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="184" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
  <rect x="212" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="236" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">5</text>
  <rect x="264" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="288" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
</g>

<!-- 中间箭头：执行第一轮选择 -->
<g transform="translate(525, 200)">
  <!-- 向下小箭头（垂直矩形 + 下方三角） -->
  <polygon points="-10,-22 10,-22 10,6 20,6 0,26 -20,6 -10,6" fill="#b8c4cc"/>
  <text x="70" y="0" font-family="'Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="#61737c">执行第一轮选择</text>
</g>

<!-- ===== 第二行：第一轮选择后 ===== -->
<g transform="translate(360, 320)">
  <!-- 未排序区间括号（在数组上方）- 从第2个元素开始 -->
  <path d="M 60 -8 Q 66 -20 174 -20 Q 296 -20 302 -8" stroke="#61737c" stroke-width="1.4" fill="none"/>
  <text x="181" y="-28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#61737c">未排序区间</text>

  <rect x="0" y="0" width="330" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.6"/>
  <!-- 已排序(灰) 1 -->
  <rect x="4" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="28" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
  <!-- 第二个 4 换到首位（保持原色深蓝紫） -->
  <rect x="56" y="4" width="48" height="36" rx="6" ry="6" fill="#6b85d4" stroke="#187990" stroke-width="1.3"/><text x="80" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
  <!-- 其余绿色 -->
  <rect x="108" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="132" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
  <!-- 第一个 4 换到 4 的位置（亮蓝） -->
  <rect x="160" y="4" width="48" height="36" rx="6" ry="6" fill="#7eb6e8" stroke="#187990" stroke-width="1.3"/><text x="184" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
  <rect x="212" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="236" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">5</text>
  <rect x="264" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="288" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>

  <!-- 交换弧线1: 第一个 4（下） -> 第二个 4（下） 蓝色 放在上方 -->
  <!-- 第一个4位置 x=80, 第二个4位置 x=184，弧线从下方上方向下绕过中间元素 -->
  <path d="M 80 50 C 80 90, 184 90, 184 50" stroke="#7eb6e8" stroke-width="1.6" fill="none"/>
  <polygon points="178,56 190,56 184,46" fill="#7eb6e8"/>

  <!-- 交换弧线2: 1（下） <- 第一个 4（下） 橙色 放在下方，箭头指向 1 -->
  <path d="M 184 56 C 184 130, 28 130, 28 50" stroke="#e96a6a" stroke-width="1.6" fill="none"/>
  <polygon points="22,56 34,56 28,46" fill="#e96a6a"/>
</g>

<!-- 说明框 -->
<g transform="translate(320, 480)">
  <rect x="0" y="0" width="440" height="80" rx="10" ry="10" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="220" y="32" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#1d2a2f">完成第一轮选择后，</text>
  <text x="220" y="60" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#1d2a2f">两个元素 <tspan fill="#187990">4</tspan> 的相对位置发生了改变</text>
</g>
</svg>
