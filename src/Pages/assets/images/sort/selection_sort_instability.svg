<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="选择排序不稳定性示例">
<defs><filter id="sh" x="-4%" y="-4%" width="108%" height="112%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#187990" flood-opacity=".07"/></filter></defs>

<!-- ===== 第一行：初始状态 ===== -->
<g transform="translate(200, 60)">
  <!-- 未排序区间括号（在数组上方） -->
  <path d="M 8 -8 Q 14 -20 158 -20 Q 296 -20 302 -8" stroke="#61737c" stroke-width="1.4" fill="none"/>
  <text x="155" y="-28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">未排序区间</text>

  <rect x="0" y="0" width="330" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.6"/>
  <!-- 两个4用蓝色区分 -->
  <rect x="4" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5e2" stroke="#187990" stroke-width="1.3"/><text x="28" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <rect x="56" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5e2" stroke="#187990" stroke-width="1.3"/><text x="80" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <!-- 其余绿色 -->
  <rect x="108" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="132" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">3</text>
  <rect x="160" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="184" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <rect x="212" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="236" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">5</text>
  <rect x="264" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="288" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>
</g>

<!-- 中间箭头：执行第一轮选择 -->
<g transform="translate(340, 130)">
  <!-- 向右大箭头 -->
  <polygon points="-8,-15 -8,15 -20,15 0,30 20,15 8,15 8,-15" fill="#b8c4cc"/>
  <text x="80" y="15" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#61737c">执行第一轮选择</text>
</g>

<!-- ===== 第二行：第一轮选择后 ===== -->
<g transform="translate(200, 200)">
  <!-- 未排序区间括号（在数组上方）- 从第2个元素开始 -->
  <path d="M 60 -8 Q 66 -20 174 -20 Q 296 -20 302 -8" stroke="#61737c" stroke-width="1.4" fill="none"/>
  <text x="181" y="-28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#61737c">未排序区间</text>

  <rect x="0" y="0" width="330" height="44" rx="8" ry="8" fill="none" stroke="#187990" stroke-width="1.6"/>
  <!-- 已排序(灰) -->
  <rect x="4" y="4" width="48" height="36" rx="6" ry="6" fill="#b8c4cc" stroke="#61737c" stroke-width="1.3"/><text x="28" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <!-- 两个4（蓝色，相对顺序已变！）-->
  <rect x="56" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5e2" stroke="#187990" stroke-width="1.3"/><text x="80" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <rect x="160" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5e2" stroke="#187990" stroke-width="1.3"/><text x="184" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">4</text>
  <!-- 其余绿色 -->
  <rect x="108" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="132" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">3</text>
  <rect x="212" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="236" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">5</text>
  <rect x="264" y="4" width="48" height="36" rx="6" ry="6" fill="#a8d5c9" stroke="#187990" stroke-width="1.3"/><text x="288" y="28" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>

  <!-- 交换箭头：两个4之间（下方弧线）- 显示相对位置变化 -->
  <path d="M 80 52 C 80 72, 184 72, 184 52" stroke="#e6b04a" stroke-width="1.5" fill="none"/>
  <polygon points="180,54 188,54 184,60" fill="#e6b04a"/>
</g>

<!-- 说明框 -->
<g transform="translate(140, 280)">
  <rect x="0" y="0" width="440" height="58" rx="10" ry="10" fill="#f7fbfc" stroke="#d8e8ec" stroke-width="1.3"/>
  <text x="220" y="24" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">完成第一轮选择后，</text>
  <text x="220" y="46" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#1d2a2f">两个元素 <tspan fill="#187990">4</tspan> 的相对位置发生了改变</text>
</g>
</svg>